.body { overflow-y: auto; padding: 14px 18px; flex: 1; min-height: 0; }

<body>
<header>
  <h1>Agent Board</h1>
  <nav class="views" id="views" aria-label="View"></nav>
  <input id="q" placeholder="Filter by name, goal, tag, group…">
  <label id="laneslabel"><input type="checkbox" id="lanes"> Group by project</label>
  <label id="compactlabel" title="One short row per session: title, summary, and what needs you"><input type="checkbox" id="compact"> Compact</label>
  <label id="specslabel" title="A first column listing each group's Notion pages, Linear tickets, Slack threads, pull requests and artifacts"><input type="checkbox" id="specs"> Specs</label>
  <button class="btn" id="newbtn">+ New session</button>
  <button class="btn" id="dockbtn" title="Claude Code's agent view, or Codex's agent command center, in a terminal docked beside or below the board">▤ Agent view</button>
  <span class="meta" id="meta">loading…</span>
  <button class="btn" id="themebtn" type="button"></button>
</header>
<div class="err" id="err" hidden></div>
<main class="board" id="board"></main>
<section class="dock" id="dock" hidden aria-label="Agent view">
  <div class="dock-grip" id="dockgrip" title="Drag to resize"></div>
  <div class="dock-hd"><b>Agent view</b><nav class="views" id="dockagent" aria-label="Whose agent view"><button data-dockagent="claude">Claude</button><button data-dockagent="codex">Codex</button></nav><span class="muted" id="dockstate"></span>
    <span class="dock-acts"><button class="btn" id="dockpos"></button><button class="btn" id="dockre" title="Drop the connection and start the agent view again">Reconnect</button><button class="btn" id="dockx" aria-label="Close the agent view">×</button></span></div>
  <div class="term live" id="dockterm"></div>
</section>
<aside class="drawer" id="drawer">
  <div class="hd" id="dhd"></div>
  <nav class="tabs" id="dtabs"></nav>
  <div class="body" id="dbody"></div>
  <div class="foot" id="dfoot" hidden>
    <div class="reply">
      <textarea id="msg" rows="3" aria-label="Message the session"></textarea>
      <div class="rowr"><span class="muted" id="msghint"></span>
        <span><button class="btn" id="intr">Interrupt</button> <button class="btn primary" id="sendmsg">Send</button></span></div>
      <div class="note" id="msgnote" role="status"></div>
      <details class="tuionly" id="tuionly"></details>
    </div>
  </div>
</aside>
<datalist id="modellist">
  <option value="opus"><option value="sonnet"><option value="haiku">
  <option value="claude-opus-5-5"><option value="claude-sonnet-5-5"><option value="claude-haiku-4-5-20251001"><option value="claude-fable-5-1">
</datalist>

  <h3>New background session</h3>
  <label>Agent<select name="cli"><option value="claude">Claude Code</option><option value="codex">Codex (uses your Codex settings)</option></select></label>
  <label>Prompt<textarea name="prompt" rows="6" placeholder="What should the session do? Optional when you give a Linear issue."></textarea></label>

  <label>Context (optional)<textarea name="context" rows="3" spellcheck="false" placeholder="One per line: Notion, Slack, GitHub or other links, Linear issue IDs, or file paths"></textarea></label>
  <div class="two">
    <label>Directory<input name="cwd" list="dirlist" required spellcheck="false"></label>

  <label>Extra folders it may use, comma-separated (optional)<input name="addDirs" spellcheck="false" placeholder="/Users/…/other-repo"></label>
  </div>

  <datalist id="taglist2"></datalist>

</form></dialog>

  <div class="mdhd"><b id="mdtitle"></b><span class="muted" id="mdmeta"></span><button class="btn" id="mdclose">Close</button></div>
  <div class="md mdbody" id="mdbody"></div>
</dialog>
<script>
// A working session is shown as researching or building, from what its latest turn did. One that ended its turn
// asking you something is in Needs input; Done holds the rest, stopped and idle terminal sessions with their own stripe and chip.
const COLS = [
  ["researching", "Researching", "--research"],
  ["building", "Building", "--working"],
  ["needs-input", "Needs input", "--needs"],
  ["done", "Done", "--done"],
];
const colVar = Object.fromEntries(COLS.map(([k, , v]) => [k, `var(${v})`]));
const colOf = (c) => (c.column === "working" ? (c.phase === "build" ? "building" : "researching") : c.column === "needs-input" || needsOf(c).length ? "needs-input" : "done");
const RESTING = {
  stopped: "Its process is not running. Open resumes it.",
  interactive: "Started in a terminal and idle, waiting for your next message.",
};
const stripeOf = (c) => (colOf(c) === "done" && RESTING[c.column] ? `var(--${c.column})` : colVar[colOf(c)]);
// The oldest ask first.
const waitOf = (c) => c.waitingSince ?? c.updatedAt ?? c.startedAt ?? 0;
const cardsIn = (l, key) => {
  const cards = l.cards.filter((c) => colOf(c) === key);
  return key === "needs-input" ? cards.toSorted((x, y) => waitOf(x) - waitOf(y)) : cards;
};
const restingChip = (c) => (RESTING[c.column] ? `<span class="chip" title="${RESTING[c.column]}">${c.column}</span>` : "");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
// `breaks` keeps single line breaks, as a terminal shows them; documents keep standard Markdown.
const md = (s, { breaks = false } = {}) => {
  if (!s) return "";
  if (!window.marked || !window.DOMPurify) return `<pre>${esc(s)}</pre>`;
  return DOMPurify.sanitize(marked.parse(s, { breaks }));
};
const dur = (t) => {
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return `${Math.round(s)}s`;
  if (s < 3600) return `${Math.round(s / 60)}m`;
  if (s < 86400) return `${Math.round(s / 3600)}h`;
  return `${Math.round(s / 86400)}d`;
};
const ago = (t) => (t ? `${dur(t)} ago` : "");
const needsOf = (c) => [c.blocker, ...(c.summary?.needsYou ?? []).filter((x) => x !== c.blocker)].filter(Boolean);
const ENDINGS = { error: "error", interrupted: "interrupted", "cut-off": "cut off" };
const endingChip = (c) => (c.ending ? `<span class="chip bad" title="${esc(c.ending.text)}">${ENDINGS[c.ending.kind]}</span>` : "");
const nowHtml = (c) => (c.status ? `<div class="now${c.ending ? " bad" : ""}">${esc(c.status)}</div>` : "");
const concernsOf = (c) => [c.failed && `Failed: ${c.failed}`, ...(c.summary?.concerns ?? [])].filter(Boolean);
const short = (p) => (p ?? "").replace(/^\/Users\/[^/]+/, "~");

// What the board cannot do for a session: the terminal screen does it, in the Terminal tab.
const TUI_ONLY = [
  "Permission prompts, the session's questions, and plan approve/reject",
  "Pickers: /model, /config, /mcp, /permissions, /agents, /plugin, and /rewind (Esc Esc)",
  "Typing aids: @-file and slash-command autocomplete, Shift+Tab mode switching, ! bash mode, Ctrl+R history, vim mode",

const TABS = ["conversation", "summary", "context", "spec", "progress", "team", "terminal"];

// Tags are manual groups: a tagged card sits in each tag's lane, an untagged one in its auto group's.
// Lanes match case-insensitively, so tagging a card with a group's name moves it into that group.
function lanesOf(cards) {
  const lanes = new Map();
  for (const c of cards) {
    const keys = c.tags.length ? c.tags.map((t) => [t, true]) : [[c.group ?? "Ungrouped", false]];
    for (const [name, fromTag] of keys) {
      const id = name.toLowerCase();
      const lane = lanes.get(id) ?? { id, name, cards: [] };
      lanes.set(id, { ...lane, name: fromTag ? name : lane.name, cards: [...lane.cards, c] });
    }
  }
  // Alphabetical, so lanes stay put as sessions change; Ungrouped comes last.
  return [...lanes.values()]
    .map((l) => ({ ...l, needs: l.cards.filter((c) => needsOf(c).length).length }))
    .toSorted((x, y) => (x.id === "ungrouped") - (y.id === "ungrouped") || x.name.localeCompare(y.name, undefined, { sensitivity: "base", numeric: true }));
}

// ---- Outside context
// What each kind of source is called, and the mark on its chip.
const KINDS = {
  notion: ["Notion page", "N", "notion"], "linear-issue": ["Linear issue", "L", "linear"], "linear-project": ["Linear project", "L", "linear"],
  "linear-doc": ["Linear document", "L", "linear"], "slack-thread": ["Slack thread", "S", "slack"], "slack-channel": ["Slack channel", "S", "slack"],
  pr: ["Pull request", "PR", "pr"], artifact: ["Artifact", "A", "artifact"], link: ["Link", "↗", "link"],
};
const kindOf = (e) => KINDS[e.kind] ?? KINDS.link;
const CLOSED_RE = /^(done|canceled|cancelled|duplicate|closed|merged|released)$/i;
const keyOf = (s) => `${s.kind}:${s.id}`;
const calls = (t) => t.used + t.produced + t.linked;
// A session's title for a source beats one typed on a pin, which beats a stand-in like "Notion page".
const titleOf = (e) => e.title ?? e.typed ?? e.standIn ?? e.id;
// Ranks by a list of keys, highest first; booleans count as 1 and 0.
const byRank = (f) => (x, y) => {
  const a = f(x);
  const b = f(y);
  const i = a.findIndex((v, j) => v !== b[j]);
  return i < 0 ? 0 : b[i] - a[i];
};

// A group's pins and hides stay with its name; once no lane has that name, they follow the lane holding most of its sessions.
function laneOwns(p, lane) {
  if (!p.group) return false;
  if (p.group.id === lane.id) return true;
  if (shownLanes.some((l) => l.id === p.group.id)) return false;
  const overlap = (l) => l.cards.filter((c) => p.group.sessionIds.includes(c.id)).length;
  return overlap(lane) > 0 && shownLanes.toSorted((x, y) => overlap(y) - overlap(x))[0]?.id === lane.id;
}
const pinsOfCard = (c) => (data.pins ?? []).filter((p) => p.session === c.sessionId);

// A lane's context: what its sessions touched and what was pinned to it or them, most shared first; `hides` marks
// what a person removed from the group.
function entriesOf(lane) {
  const entries = new Map();
  const entry = (s) => {
    const key = keyOf(s);
    if (!entries.has(key)) entries.set(key, { key, kind: s.kind, id: s.id, url: s.url, title: null, typed: null, standIn: null, status: null, statusAt: null, lastAt: null, touched: [], pins: [], hides: [] });
    return entries.get(key);
  };
  for (const c of lane.cards) {
    for (const s of c.context ?? []) {
      const e = entry(s);
      e.touched.push({ card: c, used: s.used, produced: s.produced, linked: s.linked });
      if (s.untitled) e.standIn ??= s.title;
      else e.title ??= s.title;
      e.url ??= s.url;
      if (s.statusAt && !(e.statusAt > s.statusAt)) Object.assign(e, { status: s.status, statusAt: s.statusAt });
      if (!(e.lastAt > s.lastAt)) e.lastAt = s.lastAt;
    }
  }
  const pinned = [...(data.pins ?? []).filter((p) => laneOwns(p, lane)), ...lane.cards.flatMap(pinsOfCard)];
  for (const p of new Set(pinned)) {
    const e = entry(p.source);
    e.pins.push(p);
    if (p.source.untitled) e.standIn ??= p.source.title;
    else e.typed ??= p.source.title;
    e.url ??= p.source.url;
  }
  for (const h of (data.hides ?? []).filter((x) => laneOwns(x, lane))) entries.get(h.key)?.hides.push(h);
  return [...entries.values()].toSorted(byRank((e) => [e.pins.length > 0, e.touched.length, e.touched.reduce((n, t) => n + calls(t), 0), Date.parse(e.lastAt ?? 0) || 0]));
}

const shelfOf = (lane) => entriesOf(lane).filter((e) => !e.hides.length);
const groupRef = (l) => ({ id: l.id, name: l.name, sessionIds: l.cards.map((c) => c.id) });
function closedNote(l, anchor) {
  const active = l.cards.filter((c) => c.column === "working" || c.column === "needs-input").length;
  return anchor && CLOSED_RE.test(anchor.status ?? "") && active ? `${anchor.id} is ${anchor.status} but ${active} session${active === 1 ? " is" : "s are"} still active` : "";
}

// The ticket or document a group is about: a pinned one, else the one most of its sessions touched, a ticket before a doc.
const anchorOf = (shelf) =>
  shelf.filter((e) => ["linear-issue", "linear-project", "notion"].includes(e.kind))
    .toSorted(byRank((e) => [e.pins.length > 0, e.touched.length, e.kind === "linear-issue", e.touched.reduce((n, t) => n + calls(t), 0)]))[0] ?? null;

function handoffLines(e) {
  const names = (list) => list.map((t) => t.card.name).join(", ");
  const wrote = e.touched.filter((t) => t.produced);
  const read = e.touched.filter((t) => !t.produced && t.used);
  const linked = e.touched.filter((t) => !t.produced && !t.used && t.linked);
  return [
    wrote.length && `Written by: ${names(wrote)}`,
    read.length && `Read by: ${names(read)}`,
    linked.length && `You linked it in: ${names(linked)}`,
    e.pins.length && "Pinned",
    e.pins.length && !e.touched.length && "No session here has opened it yet.",
  ].filter(Boolean);
}
const isHandoff = (e) => e.touched.some((t) => t.produced) && e.touched.some((t) => !t.produced);
const matches = (e) => Boolean(query) && [titleOf(e), e.id, e.url].join(" ").toLowerCase().includes(query);
const srcText = (e) => (e.kind === "linear-issue" && titleOf(e) !== e.id ? `${e.id} ${titleOf(e)}` : titleOf(e));
const srcTip = (e) => [`${kindOf(e)[0]}: ${srcText(e)}`, e.status && `${e.status}${e.statusAt ? ` as of ${ago(Date.parse(e.statusAt))}` : ""}`, ...handoffLines(e)].filter(Boolean).join("\n");

function srcChip(e, { anchor = false } = {}) {
  const [, mark, cls] = kindOf(e);
  const text = srcText(e);
  const tip = srcTip(e);
  const classes = ["src", anchor && "anchor", e.pins.length && !e.touched.length && "cold", matches(e) && "hit"].filter(Boolean).join(" ");
  const max = anchor ? 90 : 60;
  const inner = `<span class="mk k-${cls}">${mark}</span><span class="tx">${isHandoff(e) ? "⇢ " : ""}${esc(text.length > max ? `${text.slice(0, max - 1)}…` : text)}</span>${e.status ? `<span class="sst">· ${esc(e.status)}</span>` : ""}`;
  return e.url
    ? `<a class="${classes}" href="${esc(e.url)}" target="_blank" rel="noopener" title="${esc(tip)}">${inner}</a>`
    : `<span class="${classes}" title="${esc(tip)}">${inner}</span>`;
}

// A row in the Specification column: the link, then its status and which of the group's sessions wrote or read it.
function specRow(e, { anchor = false, edit = true, hidden = false } = {}) {
  const [, mark, cls] = kindOf(e);
  const text = srcText(e);
  const wrote = e.touched.filter((t) => t.produced).length;
  const read = e.touched.length - wrote;
  const meta = [e.status, wrote && `${wrote} wrote`, read && `${read} read`, e.pins.length && "pinned"].filter(Boolean).join(" · ");
  const name = e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(text)}</a>` : esc(text);
  const classes = ["srow", anchor && "anchor", hidden && "gone", e.pins.length && !e.touched.length && "cold", matches(e) && "hit"].filter(Boolean).join(" ");
  const act = !edit ? ""
    : hidden ? `<button class="sact" data-unhide="${esc(e.hides.map((h) => h.id).join(","))}" title="Show it in this group again" aria-label="Restore ${esc(text)}">↺</button>`
    : `<button class="sact" data-drop="${esc(e.key)}" title="${e.touched.length ? "Remove it from this group. Its sessions touched it, so it is hidden, and “hidden” below restores it." : "Unpin"}" aria-label="Remove ${esc(text)}">×</button>`;
  return `<div class="${classes}" title="${esc(srcTip(e))}"><span class="mk k-${cls}">${mark}</span><div class="sbody"><div class="stitle">${isHandoff(e) ? "⇢ " : ""}${name}</div>${meta ? `<div class="smeta">${esc(meta)}</div>` : ""}</div>${act}</div>`;
}
const SPEC_GROUPS = [["linear", "Linear"], ["notion", "Notion"], ["slack", "Slack"], ["pr", "Pull requests"], ["artifact", "Artifacts"], ["link", "Links"]];

const SHELF_SHOWN = 6;
const openShelves = new Set(); // lanes whose full shelf is shown
const pinPanels = new Set(); // lanes whose pin panel is open
const openHidden = new Set(); // lanes whose removed links are listed
const openSpecLanes = new Set(); // lanes whose links are open while the Specs column is off
function shelfHtml(l) {
  const everything = entriesOf(l);
  const shelf = everything.filter((e) => !e.hides.length);
  const hidden = everything.filter((e) => e.hides.length);
  const panel = pinPanels.has(l.id);
  // Pins and hides belong to a group, so the board without lanes lists links but changes none.
  const edit = Boolean(l.id);
  const pinBtn = edit ? `<button class="btn pinbtn${panel ? " on" : ""}" data-pinlane="${esc(l.id)}" title="Pin a Notion, Linear, Slack, GitHub or artifact link to this group">📎 Pin a link</button>` : "";
  const anchor = anchorOf(shelf);
  const rest = shelf.filter((e) => e !== anchor);
  const all = openShelves.has(l.id);
  // Compact lanes stay as short as their cards.
  const limit = compact ? 3 : SHELF_SHOWN;
  const shown = all ? rest : rest.slice(0, limit);
  const note = closedNote(l, anchor);
  const closed = note ? `<span class="chip" title="The group's ${esc(kindOf(anchor)[0].toLowerCase())} is closed while its sessions still work">⚠ ${esc(note)}</span>` : "";
  const more = rest.length > limit ? `<button class="btn more" data-shelf="${esc(l.id)}">${all ? "less" : `+${rest.length - limit} more`}</button>` : "";
  const none = shelf.length ? "" : '<div class="empty" style="font-size:12px;padding:2px 6px">No docs, tickets or threads yet</div>';
  const about = anchor ? `<div class="sgroup"><h5>About</h5>${specRow(anchor, { anchor: true, edit })}</div>` : "";
  const groups = SPEC_GROUPS.map(([cls, heading]) => {
    const rows = shown.filter((e) => kindOf(e)[2] === cls);
    return rows.length ? `<div class="sgroup"><h5>${heading}</h5>${rows.map((e) => specRow(e, { edit })).join("")}</div>` : "";
  }).join("");
  const showHidden = edit && openHidden.has(l.id);
  const hiddenBtn = edit && hidden.length ? `<button class="btn more${showHidden ? " on" : ""}" data-showhidden="${esc(l.id)}" title="Links removed from this group">${hidden.length} hidden</button>` : "";
  const gone = showHidden && hidden.length ? `<div class="sgroup"><h5>Hidden</h5>${hidden.map((e) => specRow(e, { hidden: true })).join("")}</div>` : "";
  return `<div class="shelf" data-speclane="${esc(l.id)}">${closed}${about}${groups}${none}${gone}<div class="shelf-acts">${more}${hiddenBtn}${pinBtn}</div></div>${panel ? pinPanelHtml(l, shelf) : ""}`;

// With the Specs column off, a lane's header carries the link it is about and a button that opens the rest.
function laneLinks(l) {
  const shelf = shelfOf(l);
  const anchor = anchorOf(shelf);
  const note = closedNote(l, anchor);
  const open = openSpecLanes.has(l.id);
  const label = shelf.length ? `${shelf.length} link${shelf.length === 1 ? "" : "s"}` : "📎 Links";
  return `${anchor ? srcChip(anchor) : ""}${note ? `<span class="chip" title="${esc(note)}">⚠ still active</span>` : ""}<button class="btn more${open ? " on" : ""}" data-specopen="${esc(l.id)}" title="This group's docs, tickets, threads and pull requests">${label}</button>`;
}

const pinForm = (target) => `<form class="pinform" data-pintarget="${esc(JSON.stringify(target))}" data-pinkey="${esc(target.group?.id ?? target.session)}">

  <input name="title" maxlength="160" placeholder="Title (optional)" aria-label="Title"><button class="btn primary">Pin</button></form>`;

function pinPanelHtml(l, shelf) {
  const mine = (data.pins ?? []).filter((p) => laneOwns(p, l));
  const target = { group: groupRef(l) };
  const untouched = shelf.filter((e) => e.pins.length && !e.touched.length).length;
  return `<div class="pinpanel">${pinForm(target)}${pinRows(mine)}
    <div class="muted" style="font-size:12px;margin-top:6px">Titles come from what you type until a session in the group fetches the link.${untouched ? ` ${untouched} pinned link${untouched === 1 ? " has" : "s have"} not been opened by any session here (dashed).` : ""}</div></div>`;
}

// A new session in a group starts from the group's issue and key links, so it does not rediscover them.
function contextPack(lane) {
  const shelf = shelfOf(lane);
  const anchor = anchorOf(shelf);
  const picks = [anchor, ...shelf.filter((e) => e !== anchor && (e.pins.length || e.touched.some((t) => t.produced) || e.kind === "slack-thread"))]
    .filter((e) => e?.url).slice(0, 6);
  const issue = picks.find((e) => e.kind === "linear-issue");
  return { issue: issue?.id ?? "", links: picks.filter((e) => e !== issue).map((e) => e.url) };
}

async function addPin(target, form) {
  const f = new FormData(form);
  const r = await fetch("/api/pins", { method: "POST", headers: { ...WRITE_HEADERS, "content-type": "application/json" }, body: JSON.stringify({ ...target, url: f.get("url"), title: f.get("title") }) });
  const res = await r.json().catch(() => ({ ok: false, message: `HTTP ${r.status}` }));
  if (!res.ok) return alert(res.message);
  form.reset();
  await refresh();
}
async function removePin(id) {
  await fetch(`/api/pins/${id}`, { method: "DELETE", headers: WRITE_HEADERS });
  await refresh();
}
// Removing a row unpins it; one its sessions touched would come back, so it is also hidden from the group.
async function dropSpec(lane, key) {
  const e = lane && entriesOf(lane).find((x) => x.key === key);
  if (!e) return;
  for (const p of e.pins) await fetch(`/api/pins/${p.id}`, { method: "DELETE", headers: WRITE_HEADERS });
  if (e.touched.length) await fetch("/api/hides", { method: "POST", headers: { ...WRITE_HEADERS, "content-type": "application/json" }, body: JSON.stringify({ key, group: groupRef(lane) }) });
  await refresh();
}
async function restoreSpec(ids) {
  for (const id of ids.split(",")) await fetch(`/api/hides/${id}`, { method: "DELETE", headers: WRITE_HEADERS });
  await refresh();
}

function laneHtml(l) {

let query = "";
let shownLanes = [];
// A card also matches on the titles, ids and links of its context and of pins on it or its group.
const searchText = (c) => {
  const groups = [c.group ?? "ungrouped", ...c.tags].map((g) => g.toLowerCase());
  const pinned = (data.pins ?? []).filter((p) => p.session === c.sessionId || (p.group && (groups.includes(p.group.id) || p.group.sessionIds.includes(c.id))));
  return [c.agent, c.name, c.goal, c.status, c.cwd, c.branch, c.id, c.group, c.outcome?.label, ...c.tags, ...[...(c.context ?? []), ...pinned.map((p) => p.source)].flatMap((s) => [s.title, s.id, s.url])].join(" ").toLowerCase();
};
function render() {
  query = document.getElementById("q").value.toLowerCase();
  const cards = data.cards.filter((c) => !query || searchText(c).includes(query));
  const counts = { archived: data.cards.filter((c) => c.archived).length, prs: data.prs?.open };
  const flag = (v) => (v === "prs" && data.prs?.needsYou ? ` <span class="chip warn" title="${data.prs.needsYou} need you">${data.prs.needsYou}</span>` : "");
  document.getElementById("views").innerHTML = VIEWS.map(([v, label]) =>
    `<button data-view="${v}" class="${v === view ? "on" : ""}">${label}${counts[v] != null ? ` <span class="n">${counts[v]}</span>` : ""}${flag(v)}</button>`).join("");
  document.getElementById("laneslabel").hidden = view !== "board";
  document.getElementById("compactlabel").hidden = view !== "board";
  document.getElementById("specslabel").hidden = view !== "board";
  const box = document.getElementById("board");
  if (view === "prs") return renderPrs(box);
  if (view === "journal") return renderJournal(box);
  if (view === "daily") return renderDaily(box);
  if (view === "archived") {
    if (document.activeElement?.matches?.(".alist select")) return;
    box.innerHTML = archivedHtml(cards.filter((c) => c.archived));

  }
  const active = cards.filter((c) => !c.archived);
  const lanes = lanesOn ? lanesOf(active) : [{ id: "", name: "", cards: active }];
  shownLanes = lanes;
  const specs = specsOn && new Set(lanes.flatMap((l) => shelfOf(l).map((e) => e.key))).size;
  const specHead = specsOn ? `<h2 title="The Notion pages, Linear tickets, Slack threads, pull requests and artifacts each group's sessions touched, and links pinned to it"><span class="dot" style="background:var(--muted)"></span>Specification <span class="n">${specs}</span></h2>` : "";
  box.classList.toggle("specs", specsOn);
  const head = `<div class="grid head">${specHead}${COLS.map(([key, label, v]) => `<h2><span class="dot" style="background:var(${v})"></span>${label} <span class="n">${active.filter((c) => colOf(c) === key).length}</span></h2>`).join("")}</div>`;
  // The board redraws on every poll, so a half-typed pin survives it.
  const typing = document.activeElement?.closest?.("#board .pinform");
  const kept = typing && { key: typing.dataset.pinkey, url: typing.elements.url.value, title: typing.elements.title.value, focus: document.activeElement.name };
  const before = placesOf(box);
  box.innerHTML = head + lanes.map(laneHtml).join("");

  if (form) {
    form.elements.url.value = kept.url;
    form.elements.title.value = kept.title;
    form.elements[kept.focus]?.focus();
  }
}

// Outcome colors: merged is purple as on GitHub, and statuses that record nothing stay grey.
const OUTCOME_COLOR = { none: "var(--muted)", done: "var(--done)", merged: "var(--interactive)", open: "var(--working)", closed: "var(--muted)", abandoned: "var(--stopped)", superseded: "var(--muted)" };
const outcomeColor = (c) => OUTCOME_COLOR[c.outcome?.key] ?? "var(--edge)";
function outcomeChip(c) {
  const o = c.outcome;
  if (!o) return "";
  const why = o.auto ? (o.detail ? `From its pull requests: ${o.detail}` : "No pull request of its own; set a status in the row") : "Set by you";
  return `<span class="chip ochip" style="--o:${outcomeColor(c)}" title="${esc(why)}">${esc(o.label)}</span> `;
}
// Automatic follows its pull requests; the rest are set by hand and kept in the archive record.
function outcomeSelect(c) {
  if (!c.outcome || !c.archivedAt) return "";
  const auto = c.outcome.auto ? c.outcome.label : null;
  const options = [["", `Automatic${auto ? ` (${auto})` : ""}`], ...Object.entries(data.outcomes ?? {})];
  return `<label class="ostat">Status <select data-aoutcome="${c.id}">${options.map(([k, label]) => `<option value="${k}"${(c.outcome.auto ? "" : c.outcome.key) === k ? " selected" : ""}>${esc(label)}</option>`).join("")}</select></label>`;
}
async function setOutcome(id, outcome) {
  const r = await fetch(`/api/card/${id}/outcome`, { method: "PUT", headers: { ...WRITE_HEADERS, "content-type": "application/json" }, body: JSON.stringify({ outcome: outcome || null }) });
  const res = await r.json().catch(() => ({ ok: false, message: `HTTP ${r.status}` }));
  if (!res.ok) alert(res.message);

// The day a session was archived, as a heading: Today, Yesterday, or the date, with the year when it is not this one.
function dayLabel(t) {
  if (!t) return "Date unknown";
  const d = new Date(t);
  const start = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const days = Math.round((start(new Date()) - start(d)) / 86400000);
  const date = d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric", ...(d.getFullYear() === new Date().getFullYear() ? {} : { year: "numeric" }) });
  return days === 0 ? `Today · ${date}` : days === 1 ? `Yesterday · ${date}` : date;
}

// Cards glide from where they were to where they are after a redraw. One that changed column lifts and flashes its
// new color, and a new one fades in. Nothing moves for a reader whose system asks for less motion.
const calm = matchMedia("(prefers-reduced-motion: reduce)");
const placeKey = (el) => `${el.closest(".lane")?.dataset.lane ?? ""}|${el.dataset.id}`;
function placesOf(box) {
  const places = new Map();
  for (const el of box.querySelectorAll(".card[data-id]")) {
    const place = { rect: el.getBoundingClientRect(), col: el.dataset.col };
    places.set(placeKey(el), place);
    // A card that changed lanes is found by its id alone.
    if (!places.has(el.dataset.id)) places.set(el.dataset.id, place);
  }
  return places;
}
function animateMoves(box, before) {
  if (!before.size || calm.matches) return;
  for (const el of box.querySelectorAll(".card[data-id]")) {
    const was = before.get(placeKey(el)) ?? before.get(el.dataset.id);
    if (!was) {
      el.animate([{ opacity: 0, transform: "translateY(10px) scale(.96)" }, { opacity: 1, transform: "none" }], { duration: 360, easing: "cubic-bezier(.2,.8,.2,1)" });
      continue;
    }
    const now = el.getBoundingClientRect();
    const dx = was.rect.left - now.left;
    const dy = was.rect.top - now.top;
    const recolumned = was.col !== el.dataset.col;
    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
      const lift = recolumned ? " scale(1.04) rotate(-1deg)" : "";
      el.animate([
        { transform: `translate(${dx}px, ${dy}px)${lift}`, zIndex: 3 },
        { transform: `translate(${dx * 0.1}px, ${dy * 0.1}px)${lift}`, zIndex: 3, offset: 0.7 },
        { transform: "none", zIndex: 3 },
      ], { duration: recolumned ? 720 : 420, easing: "cubic-bezier(.2,.9,.25,1.1)" });
    }
    if (recolumned) {
      const style = getComputedStyle(el);
      const ring = `0 0 0 3px ${style.getPropertyValue("--c").trim() || "currentColor"}, 0 14px 32px ${style.getPropertyValue("--shadow").trim() || "rgba(0,0,0,.3)"}`;
      el.animate([
        { boxShadow: ring },
        { boxShadow: ring, offset: 0.35 },
        { boxShadow: "0 0 0 0 transparent, 0 1px 2px rgba(0,0,0,.05)" },
      ], { duration: 1600, easing: "ease-out" });
    }
  }
}

// The Journal tab: to-dos by horizon, notes, and a brief. Its data comes from /api/journal, fetched with each poll
// while the tab is open.
const HORIZONS = ["today", "week", "later"];
const HORIZON_LABELS = { today: "Today", week: "This week", later: "Later" };
let journal = null;
let journalError = null;
const openDone = new Set(); // horizons showing their older done to-dos
const dayStart = (d = new Date()) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
const weekStart = (d = new Date()) => dayStart(d) - ((d.getDay() + 6) % 7) * 86400000;
// A done to-do stays in view for its horizon's span: done today under Today, done this week under the others.
const doneSince = { today: dayStart, week: weekStart, later: weekStart };
const LINK_RE = /(https?:\/\/[^\s<>"']+[^\s<>"'.,;:)])|\b([A-Z]{2,6}-\d{2,6})\b/g;
function linkText(s) {
  let out = "";
  let at = 0;
  for (const m of s.matchAll(LINK_RE)) {
    const url = m[1] ?? (data.linearWorkspace ? `https://linear.app/${data.linearWorkspace}/issue/${m[2]}` : null);
    const shown = m[1]?.length > 60 ? `${m[1].slice(0, 57)}…` : m[0];
    out += esc(s.slice(at, m.index)) + (url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(shown)}</a>` : esc(m[0]));
    at = m.index + m[0].length;
  }
  return out + esc(s.slice(at));
}
const ctxChip = (c) => {
  const text = `${esc(c.label)}${c.status ? ` · ${esc(c.status)}` : ""}`;
  return c.url ? `<a class="chip" href="${esc(c.url)}" target="_blank" rel="noopener">${text}</a>` : `<span class="chip">${text}</span>`;
};
const journalHit = (s) => !query || s.toLowerCase().includes(query);

function itemHtml(it) {
  const carried = !it.done && it.horizon === "today" && it.createdAt < dayStart();
  return `<li class="jn-item${it.done ? " done" : ""}" data-jitem="${it.id}">
    <input type="checkbox" data-jcheck ${it.done ? "checked" : ""} aria-label="Done">
    <div><span class="jn-text" data-jedit title="Click to edit">${linkText(it.text)}</span>${carried ? ` <span class="chip" title="Open since it was added">since ${new Date(it.createdAt).toLocaleDateString(undefined, { weekday: "short" })}</span>` : ""}
      ${it.context?.length ? `<div class="jn-ctx" title="From the last summary">${it.context.map(ctxChip).join("")}</div>` : ""}</div>
    <select data-jmove aria-label="Move to">${HORIZONS.map((h) => `<option value="${h}"${h === it.horizon ? " selected" : ""}>${HORIZON_LABELS[h]}</option>`).join("")}</select>
    <button class="jn-x" data-jdel title="Delete">×</button></li>`;
}
function groupHtml(h) {
  const since = doneSince[h]();
  const mine = journal.items.filter((it) => it.horizon === h && journalHit(it.text));
  const open = mine.filter((it) => !it.done).toSorted((a, b) => a.createdAt - b.createdAt);
  const recent = mine.filter((it) => it.done && it.doneAt >= since).toSorted((a, b) => b.doneAt - a.doneAt);
  const older = mine.filter((it) => it.done && it.doneAt < since).toSorted((a, b) => b.doneAt - a.doneAt);
  const shown = [...open, ...recent, ...(openDone.has(h) ? older : [])];
  const label = HORIZON_LABELS[h];
  return `<div class="jn-group"><h4>${label} <span class="n">${recent.length}/${open.length + recent.length} done</span></h4>
    <form class="jn-add" data-horizon="${h}"><input name="text" autocomplete="off" placeholder="Add to ${label.toLowerCase()}…" aria-label="Add a to-do to ${label}"></form>
    ${shown.length ? `<ul class="jn-items">${shown.map(itemHtml).join("")}</ul>` : ""}
    ${older.length ? `<button class="jn-more" data-jdone="${h}">${openDone.has(h) ? "Hide" : "Show"} ${older.length} done earlier</button>` : ""}</div>`;
}
const ENGINE_NAMES = { claude: "Claude", codex: "Codex" };
// Codex's own MCP config has Linear and Notion but no Slack.
const briefSources = (engine) => (engine === "codex" ? "Linear and Notion" : "Linear, Slack and Notion");
function briefHtml() {
  const s = journal.summary;
  const run = journal.running;
  const engine = data.engines?.brief ?? "codex";
  const by = s?.engine === "codex" ? `Codex ${s.model}` : s ? `Claude ${s.model} · $${(s.costUsd ?? 0).toFixed(2)}` : "";
  const meta = s?.at ? `Summarized ${dur(s.at)} ago · ${s.seconds}s · ${by}` : "";
  const pick = `<select data-jengine aria-label="Engine for the summary" ${run ? "disabled" : ""}>${Object.entries(ENGINE_NAMES).map(([v, name]) => `<option value="${v}"${v === engine ? " selected" : ""}>${name} · ${briefSources(v)}</option>`).join("")}</select>`;
  const button = `<button class="btn primary" data-jsum ${run ? "disabled" : ""} title="Reads the board, your to-dos and notes, and what changed in ${briefSources(engine)}, with read-only lookups. Usually a minute or two.">${run ? `Summarizing on ${ENGINE_NAMES[run.engine] ?? "Claude"}… ${dur(run.startedAt)}` : "Summarize now"}</button>`;
  const suggestions = s?.suggestions?.length
    ? `<div class="jn-sub"><h4>Suggested to-dos</h4>${s.suggestions.map((x, i) => `<div class="jn-srow"><span>${linkText(x.text)}</span><span class="why">${esc(x.why ?? "")}${x.url ? ` <a href="${esc(x.url)}" target="_blank" rel="noopener">link</a>` : ""}</span><button class="btn" data-jsugg="${i}">+ ${HORIZON_LABELS[x.horizon]}</button></div>`).join("")}</div>`
    : "";
  return `<div class="jn-sumhd"><h3>State of things</h3><span class="muted">${meta}</span>${pick}${button}</div>
    ${journalError ? `<p class="note bad">${esc(journalError)}</p>` : ""}
    ${s?.error && !(s.at > s.errorAt) ? `<p class="note bad">The last summary failed ${dur(s.errorAt)} ago: ${esc(s.error)}</p>` : ""}
    ${s?.text ? `${s.headline ? `<p class="jn-head">${esc(s.headline)}</p>` : ""}<div class="md jn-brief">${md(s.text)}</div>` : `<div class="empty">No summary yet. Summarize now reads the board, your to-dos and notes, and what changed in ${briefSources(engine)}.</div>`}
    ${suggestions}
    ${s?.gaps?.length ? `<p class="muted jn-sub">Not reached: ${s.gaps.map(esc).join("; ")}</p>` : ""}`;
}
function notesHtml() {
  const notes = journal.notes.filter((n) => journalHit(n.text));
  const days = Map.groupBy(notes, (n) => dayLabel(n.createdAt));
  const note = (n) => `<div class="jn-note"><div class="md">${md(n.text, { breaks: true })}</div><div class="jn-nmeta"><time>${when(n.createdAt)}</time><button class="jn-x" data-jndel="${n.id}" title="Delete note">×</button></div></div>`;
  return `<form class="jn-noteform"><textarea name="text" rows="3" placeholder="Jot a note. Markdown works; ⌘↵ saves." aria-label="New note"></textarea><div class="dlg-btns"><button class="btn primary">Add note</button></div></form>
    ${notes.length ? [...days].map(([day, list]) => `<div class="jn-day">${esc(day)}</div>${list.map(note).join("")}`).join("") : '<div class="empty">No notes yet.</div>'}`;
}
const journalHtml = () => (journal
  ? `<div class="jn"><section class="jn-panel">${briefHtml()}</section><div class="jn-cols"><section class="jn-panel"><h3>Goals and to-dos</h3>${HORIZONS.map(groupHtml).join("")}</section><section class="jn-panel"><h3>Notes</h3>${notesHtml()}</section></div></div>`
  : '<div class="jn"><div class="empty">Loading…</div></div>');
function renderJournal(box) {
  const f = document.activeElement;
  // A poll must not wipe what is being typed: a draft in an add box or the note box, or an open edit.
  if (f?.closest?.("#board .jn") && (f.matches(".jn-edit") || (f.matches("input:not([type=checkbox]), textarea") && f.value))) return;
  const refocus = f?.closest?.(".jn-add")?.dataset.horizon ?? (f?.closest?.(".jn-noteform") ? "note" : null);
  box.innerHTML = journalHtml();
  if (refocus) (refocus === "note" ? box.querySelector(".jn-noteform textarea") : box.querySelector(`.jn-add[data-horizon="${refocus}"] input`))?.focus();
}
async function loadJournal() {
  try {
    journal = await (await fetch("/api/journal")).json();
  } catch {}
  if (view === "journal") renderJournal(document.getElementById("board"));
}
async function journalWrite(method, path, body) {
  try {
    const r = await fetch(`/api/journal${path}`, { method, headers: { ...WRITE_HEADERS, "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    const res = await r.json().catch(() => ({}));
    journalError = r.ok ? null : res.message ?? `HTTP ${r.status}`;
  } catch (e) {
    journalError = e.message;
  }
  await loadJournal();
  return !journalError;
}
function startEdit(span) {
  const id = span.closest("[data-jitem]").dataset.jitem;
  const it = journal.items.find((x) => x.id === id);
  const input = Object.assign(document.createElement("input"), { className: "jn-edit", value: it.text });
  span.replaceWith(input);
  input.focus();
  let finished = false;
  const finish = (save) => {
    if (finished) return;
    finished = true;
    const text = input.value.trim();
    input.blur();
    if (save && text && text !== it.text) journalWrite("PUT", `/items/${id}`, { text });
    else renderJournal(document.getElementById("board"));
  };
  input.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") finish(true);
    if (ev.key === "Escape") finish(false);
  });
  input.addEventListener("blur", () => finish(true));
}
function journalClick(e) {
  const t = e.target;
  if (t.closest("a[href]")) return;
  if (t.closest("[data-jsum]")) return journalWrite("POST", "/summarize");
  const sugg = t.closest("[data-jsugg]");
  if (sugg) {
    const i = Number(sugg.dataset.jsugg);
    const s = journal.summary?.suggestions?.[i];
    return s && journalWrite("POST", "/items", { text: s.url ? `${s.text} ${s.url}` : s.text, horizon: s.horizon, suggestion: i });
  }
  const more = t.closest("[data-jdone]");
  if (more) {
    const h = more.dataset.jdone;
    if (!openDone.delete(h)) openDone.add(h);
    return renderJournal(document.getElementById("board"));
  }
  const del = t.closest("[data-jdel]");
  if (del) return journalWrite("DELETE", `/items/${del.closest("[data-jitem]").dataset.jitem}`);
  const noteDel = t.closest("[data-jndel]");
  if (noteDel) return confirm("Delete this note?") && journalWrite("DELETE", `/notes/${noteDel.dataset.jndel}`);
  const edit = t.closest("[data-jedit]");
  if (edit) startEdit(edit);
}
async function journalSubmit(form) {
  const text = form.elements.text.value.trim();
  if (!text) return;
  form.elements.text.value = "";
  const todo = form.matches(".jn-add");
  const ok = await journalWrite("POST", todo ? "/items" : "/notes", todo ? { text, horizon: form.dataset.horizon } : { text });
  // A failed save gives the text back rather than losing it.
  if (!ok) document.querySelector(todo ? `.jn-add[data-horizon="${form.dataset.horizon}"] input` : ".jn-noteform textarea").value = text;
}

// ---- Daily tab: a digest per day of what merged into the repository, what changed in Notion, and Slack. The server
// writes yesterday's each morning; Update rewrites the day shown.
const DIGESTS = [
  ["repo", "Mono repo", "the pull requests merged into main that day"],
  ["notion", "Notion", "that day's page edits, with read-only Notion lookups on Claude"],
  ["slack", "Slack", "that day's Slack, with read-only searches on Claude (Codex has no Slack connection)"],
];
let daily = null;
let dailyError = null;
let dailyDay = null; // the day shown, once the reader picks one
let prsOpen = false;
const dayKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const dayStartOf = (key) => {
  const [y, m, d] = key.split("-").map(Number);
  return new Date(y, m - 1, d);
};
const engineName = (d) => (d.engine === "codex" ? `Codex ${d.model}` : `Claude ${d.model} · $${(d.costUsd ?? 0).toFixed(2)}`);
// Until the reader picks a day, the newest day with a digest is shown.
const shownDay = () => dailyDay ?? Object.keys(daily.days).toSorted().at(-1) ?? dayKey(new Date());
function digestItem(it) {
  const prs = (it.prs ?? []).map((n) => `<a class="chip" href="https://github.com/${esc(daily.repo)}/pull/${n}" target="_blank" rel="noopener">#${n}</a>`).join("");
  const where = it.url ? `<a class="chip" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.where ?? "link")}</a>` : it.where ? `<span class="chip">${esc(it.where)}</span>` : "";

function digestPanel([kind, label, reads], day) {
  const d = daily.days[day]?.[kind];

  const failed = d?.error && !(d.at > d.errorAt);
  const meta = d?.at ? `Written ${dur(d.at)} ago · ${d.seconds}s · ${engineName(d)}` : "";
  const button = `<button class="btn primary" data-drun="${kind}" ${run ? "disabled" : ""} title="Reads ${reads}, then summarizes it.">${
    run ? (run.day === day ? `Updating… ${dur(run.startedAt)}` : `Busy with ${dayLabel(dayStartOf(run.day).getTime()).split(" · ")[0]}`) : d?.at ? "Update" : "Write it now"}</button>`;
  const sections = (d?.sections ?? []).map((sec) => `<div class="dl-sec${sec.title === "Heads-up" ? " heads" : ""}"><h4>${esc(sec.title)}</h4><ul class="dl-items">${sec.items.map(digestItem).join("")}</ul></div>`).join("");

    ? `<details class="dl-prs" ${prsOpen ? "open" : ""}><summary>${d.prs.length} pull request${d.prs.length === 1 ? "" : "s"} merged</summary><ul>${d.prs.toReversed().map((p) =>
      `<li><a href="${esc(p.url)}" target="_blank" rel="noopener">#${p.number}</a> ${esc(p.title)} <span class="muted">· ${esc(p.author)} · ${when(p.mergedAt)} · +${p.additions}/−${p.deletions}</span></li>`).join("")}</ul></details>`
    : "";
  return `<section class="jn-panel"><div class="jn-sumhd"><h3>${label}</h3><span class="muted">${meta}</span>${button}</div>
    ${failed ? `<p class="note bad">The last update failed ${dur(d.errorAt)} ago: ${esc(d.error)}</p>` : ""}
    ${d?.at ? `${d.headline ? `<p class="jn-head">${esc(d.headline)}</p>` : ""}${sections}${prs}` : `<div class="empty">No digest for this day yet. It reads ${reads}.</div>`}
    ${d?.gaps?.length ? `<p class="muted jn-sub">Not reached: ${d.gaps.map(esc).join("; ")}</p>` : ""}</section>`;
}
function dailyHtml() {

// ---- PRs tab: the person's open pull requests on GitHub, in columns by who acts next. The server reads them again
// every few minutes while a page is open; Refresh reads them now.
const PR_COLS = [
  ["needs-you", "Needs you", "--needs"],
  ["waiting", "Waiting for review", "--working"],
  ["approved", "Approved", "--done"],
  ["draft", "Draft", "--muted"],
];
const REVIEW_MARKS = { APPROVED: ["ok", "✓", "approved"], CHANGES_REQUESTED: ["no", "✗", "requested changes"], COMMENTED: ["", "💬", "commented"], DISMISSED: ["", "–", "had a review dismissed"] };
const CHECK_CHIPS = { pass: ["", "✓ checks", "Every check passed"], fail: ["bad", "✗ checks", "A check failed"], pending: ["warn", "● checks", "Checks are still running"] };
let prList = null;
// Sessions that worked on a pull request: they made it or were asked about it, or work in a worktree that has its branch
// or looked at it. Codex reports the branch of any checkout, so its branch counts only in a worktree.
const inWorktree = (c) => Boolean(c.cwd?.includes("/.claude/worktrees/"));
const workedOn = (c, pr) =>
  (c.branch === pr.head && (c.agent !== "codex" || inWorktree(c))) ||
  (c.context ?? []).some((s) => s.kind === "pr" && s.id === pr.id && (s.produced || s.linked || inWorktree(c)));
const sessionsOf = (pr) => data.cards.filter((c) => workedOn(c, pr));
function prCard(pr, color) {
  const reviewer = (r) => {
    const [cls, sign, did] = REVIEW_MARKS[r.state] ?? ["", "·", r.state.toLowerCase()];
    return `<span class="${cls}" title="${esc(`${r.who} ${did} ${ago(r.at)}`)}">${sign} ${esc(r.who)}</span>`;
  };
  const who = [...pr.reviews.map(reviewer), ...pr.requested.map((n) => `<span title="Review requested from ${esc(n)}">● ${esc(n)}</span>`)].join("");
  const [checkCls, checkLabel, checkTip] = CHECK_CHIPS[pr.checks] ?? [];
  const parent = prList.prs.find((p) => p.repo === pr.repo && p.head === pr.base);
  const chips = [
    checkLabel && `<span class="chip ${checkCls}" title="${esc(pr.failing.length ? `Failing: ${pr.failing.join(" · ")}` : checkTip)}">${checkLabel}</span>`,
    pr.botThreads && `<span class="chip" title="Unresolved threads a bot, such as an automated reviewer, wrote last">${pr.botThreads} bot thread${pr.botThreads === 1 ? "" : "s"}</span>`,
    pr.stacked && `<span class="chip" title="Stacked on ${esc(pr.base)}">${parent ? `on #${parent.number}` : `→ ${esc(pr.base)}`}</span>`,
    `<span class="chip" title="Lines added and removed">+${pr.additions} −${pr.deletions}</span>`,
    ...sessionsOf(pr).map((c) => `<button class="chip" data-open="${c.id}" title="Open this session">${agentChip(c)}${esc(c.name)}</button>`),
  ].filter(Boolean).join("");
  const since = pr.status === "waiting" ? `waiting ${dur(pr.waitingSince)}` : `opened ${ago(pr.createdAt)}`;
  return `<div class="card pr" style="--c:var(${color})" data-prurl="${esc(pr.url)}" title="Open on GitHub">
    <div class="ref"><span>${esc(pr.repo.split("/")[1])}#${pr.number}</span><span>${since} · updated ${ago(pr.updatedAt)}</span></div>
    <div class="t">${linkText(pr.title)}</div>
    ${pr.why.length ? `<ul class="why">${pr.why.map((w) => `<li>${esc(w)}</li>`).join("")}</ul>` : ""}
    ${who ? `<div class="who">${who}</div>` : ""}
    <div class="row">${chips}</div></div>`;
}
function prsHtml() {
  if (!prList) return '<div class="pr-top empty">Reading your pull requests from GitHub…</div>';
  const text = (p) => [p.repo, `#${p.number}`, p.title, p.head, ...p.requested, ...p.reviews.map((r) => r.who)].join(" ").toLowerCase();
  const cols = Map.groupBy(prList.prs.filter((p) => !query || text(p).includes(query)), (p) => p.status);
  const inCol = (key) => cols.get(key) ?? [];
  const read = prList.at ? `${prList.total} open${prList.total > prList.prs.length ? `; the ${prList.prs.length} updated last are shown` : ""} · read from GitHub ${ago(prList.at)} as ${esc(prList.viewer)}` : "";
  return `<div class="pr-top"><span class="muted">${read}</span>
    <button class="btn" data-prrefresh ${prList.reading ? "disabled" : ""}>${prList.reading ? "Refreshing…" : "Refresh"}</button></div>
    ${prList.error ? `<p class="note bad">Could not read your pull requests: ${esc(prList.error)}</p>` : ""}
    <div class="grid head">${PR_COLS.map(([key, label, v]) => `<h2><span class="dot" style="background:var(${v})"></span>${label} <span class="n">${inCol(key).length}</span></h2>`).join("")}</div>
    <div class="grid">${PR_COLS.map(([key, , v]) => `<div class="cell">${inCol(key).map((p) => prCard(p, v)).join("")}</div>`).join("")}</div>`;
}
function renderPrs(box) {
  box.innerHTML = prsHtml();
}
async function loadPrs() {
  try {
    prList = await (await fetch("/api/prs")).json();
  } catch {}
  if (view === "prs") renderPrs(document.getElementById("board"));
}
async function refreshPrs() {
  prList = { ...prList, reading: true };
  renderPrs(document.getElementById("board"));
  try {
    prList = await (await fetch("/api/prs", { method: "POST", headers: WRITE_HEADERS })).json();

function prsClick(e) {
  if (e.target.closest("a[href]")) return;
  if (e.target.closest("[data-prrefresh]")) return refreshPrs();
  const session = e.target.closest("[data-open]");
  if (session) return openCard(session.dataset.open);
  const card = e.target.closest("[data-prurl]");
  if (card) window.open(card.dataset.prurl, "_blank", "noopener");
}

function archivedHtml(cards) {
  if (!cards.length) return '<div class="alist"><div class="empty">Nothing archived. Archive a session from its drawer to put it away here.</div></div>';
  const rows = cards.toSorted((x, y) => (y.archivedAt ?? 0) - (x.archivedAt ?? 0));
  const days = Map.groupBy(rows, (c) => dayLabel(c.archivedAt));
  const entry = (c) => `<div class="aentry" style="--o:${outcomeColor(c)}">${c.archivedAt
    ? `<time class="atime" datetime="${new Date(c.archivedAt).toISOString()}" title="Archived ${ago(c.archivedAt)}">${new Date(c.archivedAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</time>`
    : '<span class="atime">—</span>'}${archivedRow(c)}</div>`;
  return `<div class="alist">${[...days].map(([day, list]) => `<section class="aday"><h3 class="aday-h">${esc(day)} <span class="n">${list.length}</span></h3>
    <div class="atl">${list.map(entry).join("")}</div></section>`).join("")}</div>`;
}

function archivedRow(c) {
  const s = c.summary;
  const busy = actingOn.has(c.id);
  const note = notes.get(c.id);
  const btn = (action, label, gate, cls = "") => {
    const why = gate === true ? true : c.can[gate];
    return `<button class="btn${cls}" data-aact="${action}" ${why === true && !busy ? "" : "disabled"} title="${esc(why === true ? tipOf(action, c) : why)}">${label}</button>`;
  };
  const sec = (title, body) => (body ? `<div class="sec"><h4>${title}</h4>${body}</div>` : "");
  const items = (xs) => (xs?.length ? `<ul>${xs.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : "");
  return `<details class="arow" data-id="${c.id}" ${openRows.has(c.id) ? "open" : ""}>
    <summary><span class="aname">${topicChip(c)}${issueChips(c)}${esc(c.name)}</span><span class="muted" title="${esc(c.status ?? c.goal ?? "")}">${endingChip(c)} ${esc(c.status ?? c.goal ?? "")}</span>
      <span class="muted">${esc(short(c.cwd))}${c.branch ? ` · ${esc(c.branch)}` : ""}</span>
      <span class="muted">${outcomeChip(c)}${c.saved || c.agent === "codex" ? "" : '<span class="chip bad" title="The board has no copy of its conversation; Claude Code deletes its own after 30 days idle.">not resumable after cleanup</span> '}${c.away ? "" : '<span class="chip">still in agent view</span> '}</span></summary>
    <div class="adetail">
      <div class="acts" style="margin:0 0 10px">${btn("unarchive", "Unarchive", "archive")}${c.away ? "" : btn("archive", "Remove from agent view", "archive")}${btn("details", "Open details", true)}${btn("remove", c.away && c.agent !== "codex" ? "Forget" : "Delete", "remove", " danger")}${outcomeSelect(c)}</div>
      ${note ? `<div class="note${note.bad ? " bad" : ""}" role="status" style="margin:0 0 10px">${esc(note.text)}</div>` : ""}
      ${sec("Summary", nowHtml(c))}
      ${sec("Goal", c.goal && esc(c.goal))}
      ${sec("Result", c.result && `<div class="md">${md(c.result)}</div>`)}
      ${sec("Done", items(s?.done))}
      ${sec("Next, when it resumes", items(s?.next))}
      ${sec("Concerns", items(concernsOf(c)))}
      ${sec("Original ask", c.intent && `<div class="md">${md(c.intent.length > 1200 ? `${c.intent.slice(0, 1200)}…` : c.intent)}</div>`)}
      <div class="muted" style="font-size:12px">${esc(c.id)} · last active ${ago(c.updatedAt ?? c.startedAt) || "unknown"}${c.tags.length ? ` · ${c.tags.map((t) => `#${esc(t)}`).join(" ")}` : ""}<br>
        ${c.saved ? "Resumable: Unarchive brings it back with its conversation, even after Claude Code's 30-day cleanup, from the board's copy.<br>" : ""}
        Continue by hand: <code>cd ${esc(short(c.cwd))} &amp;&amp; claude --resume ${esc(c.sessionId)}</code></div>
    </div></details>`;
}

// The compact card keeps what answers "where is it, and does it need me": title, age, summary, and chips.
function compactCardHtml(c, lane) {
  const needs = needsOf(c);
  const chips = [
    c.failed && `<span class="chip bad">failed</span>`,
    endingChip(c),
    restingChip(c),
    needs.length && `<span class="chip warn" title="${esc(needs.join("\n"))}">needs you${c.waitingSince ? ` · ${dur(c.waitingSince)}` : ""}</span>`,
    c.progress && `<span class="chip">${c.progress.done}/${c.progress.total} tasks</span>`,
    syncButton(c),
  ].filter(Boolean).join("");
  return `<div class="card min" style="--c:${stripeOf(c)}" data-id="${c.id}" data-col="${colOf(c)}" title="${esc(c.goal ? `Goal: ${c.goal}` : "")}">
    <div class="mt"><span class="t">${agentChip(c)}${archivedChip(c)}${topicChip(c, lane)}${issueChips(c)}${esc(c.name)}</span><span class="age">${c.updatedAt ?? c.startedAt ? dur(c.updatedAt ?? c.startedAt) : ""}</span></div>
    ${c.status ? `<div class="ms">${esc(c.status)}</div>` : ""}
    ${chips ? `<div class="mc">${chips}</div>` : ""}</div>`;
}

function cardHtml(c, lane) {
  // Finished work is most of the board, so it gets the short card.
  if (compact || colOf(c) === "done") return compactCardHtml(c, lane);
  const p = c.progress;
  const needs = needsOf(c);
  const concerns = concernsOf(c);
  // One line of chips, for what went wrong or needs a look; counts, branch and team are in the drawer.
  const chips = [
    c.failed && `<span class="chip bad">failed</span>`,
    endingChip(c),
    restingChip(c),
    concerns.length && `<span class="chip" title="${esc(concerns.join("\n"))}">⚠ ${concerns.length} concern${concerns.length > 1 ? "s" : ""}</span>`,
    c.summaryMeta.pending && `<span class="chip">summarizing…</span>`,
    c.summaryMeta.error && !c.summary && `<span class="chip bad">summary failed</span>`,
    syncButton(c),
  ].filter(Boolean).join("");
  const at = c.updatedAt ?? c.startedAt;
  return `<div class="card" style="--c:${stripeOf(c)}" data-id="${c.id}" data-col="${colOf(c)}" title="${esc(c.goal ? `Goal: ${c.goal}` : "")}">
    <div class="mt"><div class="t">${agentChip(c)}${archivedChip(c)}${topicChip(c, lane)}${esc(c.name)}</div><span class="age">${at ? dur(at) : ""}</span></div>
    ${c.tags.length || issueChips(c) ? `<div class="tags">${issueChips(c)}${c.tags.map((t) => `<span class="tag">#${esc(t)}</span>`).join("")}</div>` : ""}
    ${c.status ? nowHtml(c) : c.goal ? `<div class="goal">${esc(c.goal)}</div>` : ""}
    ${c.column === "working" && c.detail ? `<div class="d">${esc(c.detail)}</div>` : ""}
    ${needs.length ? `<div class="needs"><div class="w">Needs you${c.waitingSince ? ` · waiting ${dur(c.waitingSince)}` : ""}</div>${esc(needs[0])}${needs.length > 1 ? ` <span class="muted">+${needs.length - 1} more</span>` : ""}</div>` : ""}
    ${p ? `<div class="bar" title="${p.done} of ${p.total} tasks done"><i style="width:${(100 * p.done) / p.total}%"></i></div>` : ""}
    ${chips ? `<div class="row">${chips}</div>` : ""}</div>`;
}

async function refresh() {
  try {
    const r = await fetch("/api/board");
    data = await r.json();
    const err = document.getElementById("err");
    err.hidden = !data.error;
    err.textContent = data.error ?? "";
    const sm = data.summaries;
    const summaries = !sm ? "server is older than this page — restart it" : sm.enabled ? `${data.engines?.cards === "codex" ? "codex" : sm.model} ${sm.calls} call${sm.calls === 1 ? "" : "s"}${sm.errors ? ` (${sm.errors} failed)` : ""} · $${sm.spentUsd.toFixed(3)} this run` : "summaries off";
    document.getElementById("meta").textContent = `${data.cards.length} sessions · ${summaries}${data.grouping ? " · grouping…" : ""} · updated ${new Date(data.at).toLocaleTimeString()}`;
    render();
    if (view === "prs") await loadPrs();
    if (view === "journal") await loadJournal();
    if (view === "daily") await loadDaily();
    if (openId) await loadDetail(openId, false);
  } catch (e) {
    document.getElementById("meta").textContent = `server unreachable: ${e.message}`;
  }
}

const knownTags = () =>
  [...new Map(data.cards.flatMap((c) => [...c.tags, ...(c.group ? [c.group] : [])]).map((t) => [t.toLowerCase(), t])).values()].toSorted();

async function saveTags(id, next) {
  await fetch(`/api/card/${id}/tags`, { method: "PUT", headers: { ...WRITE_HEADERS, "content-type": "application/json" }, body: JSON.stringify({ tags: next }) });
  await refresh();
}

const notes = new Map(); // card id -> { text, bad, action }: the last action's outcome
const drafts = new Map(); // card id -> unsent message
const actingOn = new Set();
// Outcomes of these show under the message box rather than in the header.
const COMPOSER_ACTIONS = new Set(["send", "interrupt"]);
// Codex's daemon keeps a thread loaded with no call to unload it, so a Codex card has no Stop or Restart.
const CLAUDE_ONLY_ACTIONS = new Set(["stop", "respawn"]);
const actionButtons = (d) => [
  ["rename", "Rename", "rename"],
  ["open", "Open in Terminal", "open"],
  ["stop", "Stop", "stop"],
  ["respawn", "Restart", "respawn"],
  ...(d.archived ? [["unarchive", "Unarchive", "archive"], ...(d.away ? [] : [["archive", "Remove from agent view", "archive"]])] : [["archive", "Archive", "archive"]]),
  ["remove", "Delete", "remove"],
].filter(([action]) => d.agent !== "codex" || !CLAUDE_ONLY_ACTIONS.has(action));
const archivedChip = (c) => (c.archived ? '<span class="tag arch">archived</span> ' : "");
const AGENT_LABELS = { claude: ["Claude", "A Claude Code session"], codex: ["Codex", "A Codex session, on Codex's own app-server"] };
const agentChip = (c) => {
  const [label, tip] = AGENT_LABELS[c.agent] ?? AGENT_LABELS.claude;
  return `<span class="agent ${c.agent ?? "claude"}" title="${tip}">${label}</span>`;
};
// Sync PR sends /pr-status-sync to the session, which previews its Linear and Notion updates and asks there, so
// the card moves to Needs input. Offered when the session touched a PR or works on a branch.
const syncSent = new Map(); // card id -> { ok, text, at }
const prOf = (c) => {
  const p = (c.context ?? []).filter((s) => s.kind === "pr")
    .toSorted((a, b) => (b.produced > 0) - (a.produced > 0) || String(b.lastAt ?? "").localeCompare(String(a.lastAt ?? "")))[0];
  return p ? p.url ?? `https://github.com/${p.id.replace("#", "/pull/")}` : "";
};
function syncButton(c) {
  // The sync is a Claude Code skill, typed into the session.
  if (c.away || c.agent === "codex" || !(c.branch || prOf(c))) return "";
  const pr = prOf(c);
  const why = c.can?.send;
  const busy = actingOn.has(c.id);
  const sent = syncSent.get(c.id);
  const recent = sent && Date.now() - sent.at < 120_000;
  const label = busy ? "Sending…" : recent ? (sent.ok ? "✓ Sent" : "⚠ Not sent") : "⇄ Sync PR";
  const tip = why !== true ? why : recent ? sent.text : `Run /pr-status-sync in this session${pr ? ` for ${pr}` : " on its branch"}. It lists the Linear and Notion updates and asks before writing.`;
  return `<button class="btn sync" data-syncpr="${c.id}" ${why === true && !busy ? "" : "disabled"} title="${esc(tip)}">${label}</button>`;
}
async function syncPr(c) {
  const ok = await act(c.id, "send", { text: `/pr-status-sync ${prOf(c)}`.trim() });
  syncSent.set(c.id, { ok, text: notes.get(c.id)?.text ?? "", at: Date.now() });
  render();
}
const issueChips = (c) => pinsOfCard(c).filter((p) => p.source.kind === "linear-issue")
  .map((p) => `<a class="tag lin" href="${esc(p.source.url)}" target="_blank" rel="noopener" title="${esc(p.source.untitled ? "Linear issue" : p.source.title)}">${esc(p.source.id)}</a> `).join("");
// The topic the board grouped a session under; archiving keeps it. A lane already named for it leaves it off.
const topicChip = (c, lane) => (c.group && c.group.toLowerCase() !== lane?.name?.toLowerCase() ? `<span class="tag topic" title="Topic">${esc(c.group)}</span> ` : "");
const CODEX_TIPS = {
  rename: "Rename the session, as shown here and in codex agents.",
  open: "Open the session in Codex in a Terminal window.",
  archive: "Archive the session in Codex, which takes it out of codex agents, and move it to the Archived tab. Unarchive brings it back.",
  unarchive: "Unarchive the session in Codex and bring it back onto the board.",
  remove: "Delete the session and its conversation from Codex. This cannot be undone.",
};
const tipOf = (action, d) =>
  (d.agent === "codex" && CODEX_TIPS[action]) ||
  ({
    rename: "Rename the session, as shown here and in claude agents. A running session is restarted to pick up the name.",
    open: d.live ? "Attach to the running session in a Terminal window." : "Resume this session interactively in a Terminal window.",
    stop: "Stop the process. The conversation is kept and can be resumed.",
    respawn: "Restart the process on the same conversation.",
    archive: d.archived ? "Delete it from the agent view; it stays in the Archived tab and can be unarchived. A worktree it created stays on disk." : "Move the session to the Archived tab and delete it from the agent view, stopping it if it is running. A worktree it created stays on disk, and Unarchive brings the session back, conversation intact.",
    unarchive: d.away ? "Bring the session back onto the board and into the agent view, stopped and ready to continue." : "Move the session back onto the board and remove [archived] from its name.",
    remove: d.away ? "Forget this archived session, with the board's copy of its conversation." : "Delete the session, and its worktree when that is safe.",
    details: "Open the session's drawer: conversation, summary, spec, and progress.",
  })[action];
const PENDING_TEXT = { send: "Sending…", interrupt: "Interrupting…", settings: "Saving settings…", rename: "Renaming…", archive: "Archiving: stopping it and removing it from the agent view…", unarchive: "Unarchiving…", stop: "Stopping…", respawn: "Restarting…", remove: "Deleting…", open: "Opening Terminal…" };
const DONE_TEXT = { rename: "Renamed.", open: "Opened in Terminal." };

async function act(id, action, body = {}) {
  actingOn.add(id);
  notes.set(id, { text: PENDING_TEXT[action], action });
  if (openId === id) await loadDetail(id, false, true);
  else render();
  let ok = false;
  try {
    const r = await fetch(`/api/card/${id}/${action}`, { method: "POST", headers: { ...WRITE_HEADERS, "content-type": "application/json" }, body: JSON.stringify(body) });
    const res = await r.json().catch(() => ({ ok: false, message: `HTTP ${r.status}` }));
    ok = res.ok;
    notes.set(id, { text: ok ? DONE_TEXT[action] ?? (res.message || "Done.") : res.message || `Failed (HTTP ${r.status}).`, bad: !ok, action });
  } catch (e) {
    notes.set(id, { text: e.message, bad: true, action });
  } finally {
    actingOn.delete(id);
  }
  await refresh();
  if (openId === id) await loadDetail(id, false, true);
  return ok;
}

const closeDrawer = () => {
  openId = null;
  stopLive();
  document.getElementById("drawer").classList.remove("open");
};

async function runAction(d, action) {
  if (action === "details") return openCard(d.id);
  if (action === "rename") {
    const name = prompt("New name for this session", d.name)?.trim();
    if (name && name !== d.name) act(d.id, "rename", { name });
    return;
  }
  if (action === "stop" && d.column === "working" && !confirm("The session is mid-turn. Stop it anyway?")) return;
  if (action === "remove") {
    const question = d.agent === "codex"
      ? `Delete "${d.name}"? Codex deletes the session and its conversation, and it cannot be brought back.`
      : d.away
      ? `Forget "${d.name}"? It is already out of the agent view; this removes it from the board and deletes the board's copy of its conversation, so it can no longer be unarchived. Claude's own copy stays until Claude Code's 30-day cleanup.`
      : `Delete "${d.name}"? This removes the session, and its worktree when that is safe.`;
    if (!confirm(question)) return;
    if ((await act(d.id, "remove")) && openId === d.id) closeDrawer();
    return;
  }
  act(d.id, action);
}

// ---- Settings: kept in the session's startup flags; the forms show what "default" resolves to.
const EFFORTS = ["low", "medium", "high", "xhigh", "max"];
const MODES = ["manual", "acceptEdits", "auto", "plan", "dontAsk", "bypassPermissions"];
const SETTING_LABELS = [["model", "Model"], ["effort", "Effort"], ["permissionMode", "Permissions"], ["agent", "Agent"]];
const defaultOf = (key) => `default${data.defaults?.[key] ? ` (${data.defaults[key]})` : ""}`;
function settingsFields(v = {}) {
  const opts = (list, cur) => [...new Set([...list, ...(cur ? [cur] : [])])].map((x) => `<option value="${esc(x)}" ${x === cur ? "selected" : ""}>${esc(x)}</option>`).join("");
  return `<label>Model<input name="model" list="modellist" value="${esc(v.model ?? "")}" placeholder="${esc(defaultOf("model"))}" spellcheck="false" autocomplete="off"></label>
    <label>Effort<select name="effort"><option value="">${esc(defaultOf("effort"))}</option>${opts(EFFORTS, v.effort)}</select></label>
    <label>Permission mode<select name="permissionMode"><option value="">${esc(defaultOf("permissionMode"))}</option>${opts(MODES, v.permissionMode)}</select></label>
    <label>Agent<input name="agent" value="${esc(v.agent ?? "")}" placeholder="${esc(defaultOf("agent"))}" spellcheck="false" autocomplete="off"></label>`;
}
const settingsBody = (form) => Object.fromEntries(SETTING_LABELS.map(([key]) => [key, String(new FormData(form).get(key) ?? "").trim()]));

let settingsOpen = false;
function settingsHtml(d, busy) {
  if (!d.background || d.away || d.agent === "codex") return "";
  const why = d.can.settings;
  if (settingsOpen) {
    return `<form class="setform" id="setform"><div class="setgrid" style="margin:0 0 8px">${settingsFields(d.settings)}</div>
      <div class="acts" style="margin:0;align-items:center"><button class="btn primary" ${why === true && !busy ? "" : "disabled"}>Save</button><button class="btn" type="button" id="setcancel">Cancel</button>
      <span class="muted" style="font-size:12px">${d.live ? "Saving restarts the running session to apply them." : "They apply when the session next runs."}</span></div></form>`;
  }
  return `<div class="setrow">${SETTING_LABELS.map(([key, label]) => `<span>${label} <b>${esc(d.settings[key] || defaultOf(key))}</b></span>`).join("")}
    ${d.model ? `<span>last reply from <b>${esc(d.model)}</b></span>` : ""}
    <button class="btn" id="setedit" ${why === true && !busy ? "" : "disabled"} title="${esc(why === true ? "Change the model, effort, permission mode, or agent." : why)}">Change</button></div>`;
}

// ---- Drawer
async function openCard(id) {
  openId = id;
  settingsOpen = false;
  await loadDetail(id, true);
}

// `reset` is a newly opened card or tab; `force` is a re-render the reader's own action caused.
async function loadDetail(id, reset = true, force = false) {
  const inHeader = document.activeElement?.closest?.("#dhd, #dbody .pinform");
  if (!reset && !force && (settingsOpen || (inHeader && document.activeElement.value))) return;
  const r = await fetch(`/api/card/${id}`);
  if (!r.ok || openId !== id) return;
  const d = await r.json();
  if (!tabsOf(d).includes(tab)) tab = "conversation";
  const busy = actingOn.has(id);
  const sig = JSON.stringify([d, tab, notes.get(id), busy, settingsOpen, data.defaults, tab === "context" ? data.pins : null]);
  const same = !reset && sig === lastSig;
  lastSig = sig;
  const drawer = document.getElementById("drawer");
  drawer.style.setProperty("--c", stripeOf(d));
  if (!same) renderHeader(d, busy);
  syncComposer(d, busy, reset);
  if (LIVE_TABS.has(tab)) {
    // The terminal remounts when the session starts or stops, since that changes what the tab can show.
    if (reset || mounted?.key !== `${id}:${tab}` || (tab === "terminal" && mounted.live !== (d.can.terminal === true))) mountLive(d);
    if (tab === "conversation") syncConvoStatus(d);
  } else if (!same) {
    stopLive();
    const body = document.getElementById("dbody");
    body.className = "body";
    const scroll = reset ? 0 : body.scrollTop;
    const opened = reset ? null : [...body.querySelectorAll("details")].map((x) => x.open);
    body.innerHTML = tabHtml(d);
    if (opened) body.querySelectorAll("details").forEach((x, i) => { if (i < opened.length) x.open = opened[i]; });
    body.scrollTop = scroll;
    body.querySelector(".pinform")?.addEventListener("submit", (e) => {
      e.preventDefault();
      addPin(JSON.parse(e.target.dataset.pintarget), e.target);
    });
    body.querySelectorAll("[data-unpin]").forEach((b) => (b.onclick = () => removePin(b.dataset.unpin)));
    body.querySelector("#resum")?.addEventListener("click", async () => {
      await fetch(`/api/card/${id}/summarize`, { method: "POST", headers: WRITE_HEADERS });
      refresh();
    });
  }
  drawer.classList.add("open");
}

function renderHeader(d, busy) {
  const note = notes.get(d.id);
  const hd = document.getElementById("dhd");
  hd.innerHTML = `<button class="x" id="close" aria-label="Close">×</button>
    <h3>${agentChip(d)}${archivedChip(d)}${topicChip(d)}${esc(d.name)}</h3>
    <div class="sub">${esc(d.state ?? "")} · ${esc(d.id)} · ${esc(short(d.cwd))}${d.branch ? ` · ${esc(d.branch)}` : ""}${d.tokens ? ` · ${d.tokens.toLocaleString()} tok` : ""}</div>
    <div class="acts">${actionButtons(d).map(([action, label, gate]) => {
      const why = d.can[gate];
      return `<button class="btn${action === "remove" ? " danger" : ""}" data-act="${action}" ${why === true && !busy ? "" : "disabled"} title="${esc(why === true ? tipOf(action, d) : why)}">${label}</button>`;
    }).join("")}</div>
    ${settingsHtml(d, busy)}
    ${d.away && d.agent !== "codex" ? `<div class="sub" style="margin-top:6px">Out of the agent view. Unarchive to continue it, or by hand: <code>cd ${esc(short(d.cwd))} &amp;&amp; claude --resume ${esc(d.sessionId)}</code></div>` : ""}
    ${note && !COMPOSER_ACTIONS.has(note.action) ? `<div class="note${note.bad ? " bad" : ""}" role="status">${esc(note.text)}</div>` : ""}
    <div class="tagedit">${d.tags.map((t, i) => `<span class="tag">#${esc(t)}<button data-untag="${i}" aria-label="Remove tag ${esc(t)}">×</button></span>`).join("")}
      <input id="tagin" list="taglist" maxlength="40" placeholder="add tag, Enter" aria-label="Add tag">
      <datalist id="taglist">${knownTags().map((t) => `<option value="${esc(t)}">`).join("")}</datalist>
      ${d.group ? `<span class="muted">auto group: ${esc(d.group)}</span>` : ""}</div>`;
  document.getElementById("dtabs").innerHTML = tabsOf(d).map((t) => `<button data-tab="${t}" class="${t === tab ? "on" : ""}">${t[0].toUpperCase() + t.slice(1)}</button>`).join("");
  hd.querySelector("#close").onclick = closeDrawer;
  hd.querySelectorAll("[data-act]").forEach((b) => (b.onclick = () => runAction(d, b.dataset.act)));
  hd.querySelector("#setedit")?.addEventListener("click", () => { settingsOpen = true; loadDetail(d.id, false, true); });
  hd.querySelector("#setcancel")?.addEventListener("click", () => { settingsOpen = false; loadDetail(d.id, false, true); });
  const setForm = hd.querySelector("#setform");
  if (setForm) setForm.onsubmit = async (e) => {
    e.preventDefault();
    const body = settingsBody(setForm);
    settingsOpen = false;
    await act(d.id, "settings", body);
  };
  hd.querySelectorAll("[data-untag]").forEach((b) => (b.onclick = () => saveTags(d.id, d.tags.filter((_, i) => i !== Number(b.dataset.untag)))));
  const tagIn = hd.querySelector("#tagin");
  tagIn.onkeydown = (e) => {
    if (e.key !== "Enter" || !tagIn.value.trim()) return;
    const value = tagIn.value.trim();
    tagIn.value = "";
    saveTags(d.id, [...d.tags, value]).then(() => document.getElementById("tagin")?.focus());
  };
}

document.getElementById("dtabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-tab]");
  if (!b || !openId) return;
  tab = b.dataset.tab;
  store.set("agent-board-tab", tab);
  loadDetail(openId, true);
});

// ---- Message box: always in the footer, so a draft survives tab switches and polls.
const msg = document.getElementById("msg");
const sendBtn = document.getElementById("sendmsg");
const intrBtn = document.getElementById("intr");
document.getElementById("tuionly").innerHTML = `<summary><b>Needs the Terminal tab:</b> prompts and questions, pickers such as /model, autocomplete and Shift+Tab, live streaming</summary>
  <ul>${TUI_ONLY.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
function syncComposer(d, busy, reset) {
  document.getElementById("dfoot").hidden = tab === "terminal" || !d.background || d.away;
  if (reset) msg.value = drafts.get(d.id) ?? "";
  const why = d.can.send;
  msg.placeholder = why === true
    ? d.live ? "Message the session. It is typed into its terminal, so it queues if the session is mid-turn. ⌘↵ sends." : "Message the session. It is stopped, so this resumes it with your message. ⌘↵ sends."
    : why;
  sendBtn.disabled = why !== true || busy;
  sendBtn.title = why === true ? "" : why;
  intrBtn.disabled = d.can.interrupt !== true || busy;
  intrBtn.title = d.can.interrupt === true ? "Press Esc in the session: stops the current turn, or cancels a prompt on screen." : d.can.interrupt;
  const note = notes.get(d.id);
  const noteEl = document.getElementById("msgnote");
  noteEl.textContent = note && COMPOSER_ACTIONS.has(note.action) ? note.text : "";
  noteEl.className = `note${note?.bad ? " bad" : ""}`;
}
msg.oninput = () => { if (openId) drafts.set(openId, msg.value); };
async function sendIt() {
  const id = openId;
  const text = msg.value.trim();
  if (!id || !text || sendBtn.disabled) return;
  if (!(await act(id, "send", { text }))) return;
  drafts.delete(id);
  if (openId === id) msg.value = "";
}
msg.onkeydown = (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendIt(); } };
sendBtn.onclick = sendIt;
intrBtn.onclick = () => openId && act(openId, "interrupt");

// ---- Live tabs
let mounted = null; // { key: "<id>:<tab>", live, stop() }
const stopLive = () => { mounted?.stop(); mounted = null; };
function mountLive(d) {
  stopLive();
  const body = document.getElementById("dbody");
  body.className = `body${tab === "terminal" ? " fill" : ""}`;
  mounted = { key: `${d.id}:${tab}`, ...(tab === "conversation" ? mountConversation(d, body) : mountTerminal(d, body)) };
