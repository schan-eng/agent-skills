const when = (at) => (at ? new Date(at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "");
const TOOL_ARG = { Bash: "command", Read: "file_path", Edit: "file_path", Write: "file_path", NotebookEdit: "notebook_path", Grep: "pattern", Glob: "pattern", Agent: "description", Task: "description", Skill: "skill", WebFetch: "url", WebSearch: "query", ToolSearch: "query" };
const toolName = (n) => n.replace(/^mcp__(plugin_)?/, "").replaceAll("__", " · ");
function toolLabel(s) {
  const i = s.input ?? {};
  const v = i[TOOL_ARG[s.name]] ?? Object.values(i).find((x) => typeof x === "string") ?? "";
  return short(String(v).split("\n")[0]).slice(0, 160);
}
const diffHtml = (a = "", b = "") =>
  [...a.split("\n").map((l) => `<span class="del">- ${esc(l)}</span>`), ...b.split("\n").map((l) => `<span class="add">+ ${esc(l)}</span>`)].join("\n");
function toolDetail(s) {
  const i = s.input ?? {};
  if (s.name === "Edit") return `<pre>${diffHtml(i.old_string, i.new_string)}</pre>`;
  if (s.name === "Write") return `<pre>${esc(i.content ?? "")}</pre>`;
  if (s.name === "Bash") return `<pre>${esc(i.command ?? "")}</pre>${i.description ? `<div class="muted">${esc(i.description)}</div>` : ""}`;
  return `<pre>${esc(JSON.stringify(i, null, 2))}</pre>`;
}
function stepHtml(s) {
  if (s.kind === "user") return `<div class="who">You · ${when(s.at)}</div><div class="txt">${esc(s.text)}</div>`;
  if (s.kind === "text") return `<div class="md">${md(s.text, { breaks: true })}</div>`;
  if (s.kind === "thinking") return `<summary class="muted">Thinking</summary><div class="txt muted">${esc(s.text)}</div>`;
  if (s.kind === "note") return `${esc(s.text)} · ${when(s.at)}`;
  return `<summary><span class="tn">${esc(toolName(s.name))}</span><span class="targ">${esc(toolLabel(s))}</span><span class="res muted">⎿ running…</span></summary>
    ${toolDetail(s)}<pre class="tout" hidden></pre>`;
}
function fillResult(el, s) {
  const lines = s.text ? s.text.split("\n") : [];
  const res = el.querySelector(".res");
  res.textContent = `⎿ ${s.error ? "error: " : ""}${lines.length ? `${lines[0].slice(0, 140)}${lines.length > 1 ? ` … +${lines.length - 1} lines` : ""}` : "done"}`;
  res.classList.toggle("bad", s.error);
  const out = el.querySelector(".tout");
  out.hidden = !s.text;
  out.textContent = s.text;
}

function mountConversation(d, body) {
  body.innerHTML = `<div class="convo" id="convo"><div class="empty">Loading…</div></div><div class="convo-status" id="convostatus"></div>`;
  const box = body.querySelector("#convo");
  const tools = new Map(); // tool_use id -> its element, for the result that follows
  let next = null;
  let stopped = false;
  let loading = false;
  const add = (s) => {
    if (s.kind === "result") return tools.has(s.id) && fillResult(tools.get(s.id), s);
    const el = document.createElement(s.kind === "tool" || s.kind === "thinking" ? "details" : "div");
    el.className = `st ${s.kind}`;
    el.innerHTML = stepHtml(s);
    if (s.kind === "tool") tools.set(s.id, el);
    box.append(el);
  };
  const poll = async () => {
    if (loading || stopped) return;
    loading = true;
    try {
      const r = await fetch(`/api/card/${d.id}/conversation${next == null ? "" : `?from=${encodeURIComponent(next)}`}`);
      const res = await r.json();
      if (stopped) return;
      const atBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 80;
      if (res.reset) {
        box.innerHTML = res.steps.length ? "" : '<div class="empty">No conversation yet.</div>';
        tools.clear();
      } else if (res.steps.length) box.querySelector(":scope > .empty")?.remove();
      res.steps.forEach(add);
      next = res.next;
      if (res.reset || (atBottom && res.steps.length)) body.scrollTop = body.scrollHeight;
    } catch {
      // The next poll retries.
    } finally {
      loading = false;
    }
  };
  poll();
  const timer = setInterval(poll, 1500);
  return { stop() { stopped = true; clearInterval(timer); } };
}

function syncConvoStatus(d) {
  const el = document.getElementById("convostatus");
  if (!el) return;
  const [cls, text] = !d.background
    ? ["", "Open in a terminal: follow it here, answer it in that terminal."]
    : d.waiting
      ? ["warn", "⏸ Waiting on a permission prompt or a question. Answer it in the Terminal tab."]
      : d.column === "working"
        ? ["busy", "● Working… new steps appear as they happen."]
        : d.live
          ? ["", "Idle, waiting for a message."]
          : ["", "Not running. A message resumes it."];
  el.className = `convo-status ${cls}`;
  el.textContent = text;
}

const XTERM = "https://cdn.jsdelivr.net/npm/@xterm";
let xtermReady = null;
const loadScript = (src) => new Promise((resolve, reject) => document.head.append(Object.assign(document.createElement("script"), { src, onload: resolve, onerror: () => reject(new Error(`Could not load ${src}`)) })));
const loadXterm = () =>
  (xtermReady ??= (async () => {
    document.head.append(Object.assign(document.createElement("link"), { rel: "stylesheet", href: `${XTERM}/xterm@5.5.0/css/xterm.css` }));
    await loadScript(`${XTERM}/xterm@5.5.0/lib/xterm.js`);
    await loadScript(`${XTERM}/addon-fit@0.10.0/lib/addon-fit.js`);
    await loadScript(`${XTERM}/addon-web-links@0.11.0/lib/addon-web-links.js`);
  })().catch((e) => { xtermReady = null; throw e; }));

// Markdown file paths on a terminal line, which open in the preview; http(s) links belong to the web-links addon.
const MD_PATH_RE = /(?<![\w.\/~-])(?:~\/|\.{1,2}\/|\/)?(?:[\w.@+-]+\/)*[\w@+-][\w.@+-]*\.(?:md|markdown|mdx)\b/gi;
const mdLinks = (term, open) => ({
  provideLinks(y, done) {
    const line = term.buffer.active.getLine(y - 1);
    if (!line) return done(undefined);
    // Each character's cell, since a wide character such as an emoji takes two.
    let text = "";
    const cells = [];
    for (let x = 0; x < line.length; x++) {
      const cell = line.getCell(x);
      if (!cell?.getWidth()) continue;
      const ch = cell.getChars() || " ";
      text += ch;
      for (let i = 0; i < ch.length; i++) cells.push(x + 1);
    }
    const urls = [...text.matchAll(/https?:\/\/\S+/g)].map((u) => [u.index, u.index + u[0].length]);
    const links = [...text.matchAll(MD_PATH_RE)]
      .filter((p) => !urls.some(([a, b]) => p.index < b && p.index + p[0].length > a))
      .map((p) => ({
        text: p[0],
        range: { start: { x: cells[p.index], y }, end: { x: cells[p.index + p[0].length - 1], y } },
        decorations: { pointerCursor: true, underline: true },
        activate: () => open(p[0]),
      }));
    done(links.length ? links : undefined);
  },
});

const mdDlg = document.getElementById("mddlg");
let mdOpen = null; // { id, path } of the file on show, for its relative links
async function previewMarkdown(id, path) {
  const r = await fetch(`/api/card/${id}/file?path=${encodeURIComponent(path)}`).catch(() => null);
  const f = r ? await r.json().catch(() => ({ error: `HTTP ${r.status}` })) : { error: "The board is not answering." };
  mdOpen = f.path ? { id, path: f.path } : null;
  document.getElementById("mdtitle").textContent = (f.path ?? path).split("/").pop();
  document.getElementById("mdmeta").textContent = f.path ? `${f.path} · changed ${dur(f.mtime)} ago` : path;
  const body = document.getElementById("mdbody");
  body.innerHTML = f.error ? `<p class="note bad">${esc(f.error)}</p>` : md(f.text);
  for (const a of body.querySelectorAll("a[href]")) Object.assign(a, { target: "_blank", rel: "noopener noreferrer" });
  if (!mdDlg.open) mdDlg.showModal();
  body.scrollTop = 0;
}
// A link with a scheme opens in a new tab. A relative one to another Markdown file opens here, and any other relative
// link does nothing, since it would otherwise open the board itself.
document.getElementById("mdbody").addEventListener("click", (e) => {
  const href = e.target.closest("a[href]")?.getAttribute("href");
  if (!href || /^[a-z][\w+.-]*:/i.test(href)) return;
  e.preventDefault();
  const target = mdOpen && !href.startsWith("#") && decodeURIComponent(new URL(href, `file://${mdOpen.path}`).pathname);
  if (target && /\.(md|markdown|mdx)$/i.test(target)) previewMarkdown(mdOpen.id, target);
});
document.getElementById("mdclose").onclick = () => mdDlg.close();

// A live xterm on one of the board's shared terminals over a WebSocket, which keeps keys in order and does not use up
// the browser's six HTTP connections to the board. A dropped connection comes back by itself; an exit or refusal does not.
// `files` is the session whose folder Markdown paths on screen resolve against; without it they are plain text.
function livePane(box, path, { setState, live, ended, files }) {
  let stopped = false;
  let term = null;
  let ws = null;
  let ro = null;
  let sizeTimer = null;
  let retryTimer = null;
  let tries = 0;
  let fit = null;
  // The grid follows the size the server reports, which is the smallest viewer's; the pane only says how much room it has.
  const room = () => {
    const d = fit?.proposeDimensions();
    return d?.cols > 0 && d.rows > 0 ? { cols: d.cols, rows: d.rows } : null;
  };
  const send = (msg) => ws?.readyState === WebSocket.OPEN && ws.send(JSON.stringify(msg));
  const connect = (fresh) => {
    clearTimeout(retryTimer);
    ws?.close();
    term.reset();
    setState(tries ? "Reconnecting…" : "Connecting…");
    const { cols, rows } = room() ?? { cols: term.cols, rows: term.rows };
    const s = (ws = new WebSocket(`${location.origin.replace(/^http/, "ws")}${path}${path.includes("?") ? "&" : "?"}cols=${cols}&rows=${rows}${fresh ? "&fresh=1" : ""}`));
    let final = false;
    s.onopen = () => setState(live);
    s.onmessage = (e) => {
      const m = JSON.parse(e.data);
      tries = 0;
      if (m.size && (m.size.cols !== term.cols || m.size.rows !== term.rows)) term.resize(m.size.cols, m.size.rows);
      if (m.data) term.write(m.data);
      if (m.exit) setState(ended);
      if (m.error) setState(m.error);
      final ||= Boolean(m.exit || m.error);
    };
    s.onclose = () => {
      if (stopped || final || ws !== s) return;
      const wait = Math.min(10_000, 300 * 2 ** tries++);
      setState(`Connection lost; reconnecting in ${Math.ceil(wait / 1000)}s…`);
      retryTimer = setTimeout(() => connect(false), wait);
    };
  };
  loadXterm().then(() => {
    if (stopped) return;
    term = new Terminal({ fontFamily: "Menlo, ui-monospace, monospace", fontSize: 12, cursorBlink: true, scrollback: 5000 });
    fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    // Claude prints URLs as plain text, not OSC 8 hyperlinks, so the addon finds them in the drawn screen.
    term.loadAddon(new WebLinksAddon.WebLinksAddon());
    if (files) term.registerLinkProvider(mdLinks(term, (p) => previewMarkdown(files, p)));
    term.open(box);
    term.onData((keys) => send({ data: keys }));
    // Claude's screen takes the wheel as mouse reports, and xterm sends at most one per wheel event (fewer on a
    // trackpad), so the pane sends one per line scrolled instead.
    let wheelLines = 0;
    term.attachCustomWheelEventHandler((ev) => {
      if (term.modes.mouseTrackingMode === "none" || ev.shiftKey || !ev.deltaY) return true;
      ev.preventDefault();
      const screen = box.querySelector(".xterm-screen").getBoundingClientRect();
      const delta = ev.deltaMode === WheelEvent.DOM_DELTA_PIXEL ? ev.deltaY / (screen.height / term.rows) : ev.deltaMode === WheelEvent.DOM_DELTA_LINE ? ev.deltaY : ev.deltaY * term.rows;
      wheelLines = Math.sign(delta) === Math.sign(wheelLines) ? wheelLines + delta : delta;
      const lines = Math.trunc(wheelLines);
      wheelLines -= lines;
      if (!lines) return false;
      const cell = (at, start, size, count) => Math.min(count, Math.max(1, Math.floor(((at - start) / size) * count) + 1));
      const at = `${cell(ev.clientX, screen.left, screen.width, term.cols)};${cell(ev.clientY, screen.top, screen.height, term.rows)}`;
      send({ data: `\x1b[<${lines < 0 ? 64 : 65};${at}M`.repeat(Math.min(Math.abs(lines), 30)) });
      return false;
    });
    ro = new ResizeObserver(() => {
      clearTimeout(sizeTimer);
      sizeTimer = setTimeout(() => {
        const d = room();
        if (d) send(d);
      }, 150);
    });
    ro.observe(box);
    connect(false);
    term.focus();
  }, (e) => setState(e.message));
  return {
    reconnect() {
      if (!term) return;
      tries = 0;
      connect(true);
    },
    stop() {
      stopped = true;
      clearTimeout(retryTimer);
      clearTimeout(sizeTimer);
      ws?.close();
      ro?.disconnect();
      term?.dispose();
    },
  };
}

function mountTerminal(d, body) {
  if (d.can.terminal !== true) {
    body.innerHTML = `<div class="empty">${esc(d.can.terminal)}</div>${TERM_NOTES}`;
    return { live: false, stop() {} };
  }
  body.innerHTML = `<div class="termbar"><span class="muted" id="termstate">Connecting…</span><button class="btn" id="reterm" title="Drop this pane's connection and attach again">Reconnect</button></div>
    <div class="term live" id="term"></div>${d.agent === "codex" ? CODEX_TERM_NOTES : TERM_NOTES}`;
  const pane = livePane(body.querySelector("#term"), `/api/card/${d.id}/term`, {
    setState: (t) => { const el = body.querySelector("#termstate"); if (el) el.textContent = t; },
    live: "Live: typing here goes straight to the session, including Enter on its prompts.",
    ended: "The session's terminal client exited. Reconnect attaches again.",
    files: d.id,
  });
  body.querySelector("#reterm").onclick = pane.reconnect;
  return { live: true, stop: pane.stop };
}

// The agent view dock: Claude Code's own list of background sessions, or Codex's, in one terminal shared by the board.
const dock = document.getElementById("dock");
let dockPane = null;
const DOCK_AGENTS = {
  claude: { path: "/api/agent-view/term", live: "Enter opens the selected session; ← on its empty prompt comes back to this list." },
  codex: { path: "/api/agent-view/term?agent=codex", live: "Enter opens the selected session, n starts a new one, Esc goes back." },
};
let dockAgent = store.get("agent-board-dock-agent", "claude") === "codex" ? "codex" : "claude";
function showDockAgent() {
  document.querySelectorAll("[data-dockagent]").forEach((b) => b.classList.toggle("on", b.dataset.dockagent === dockAgent));
}
// Each position keeps its own size: a height at the bottom, a width at the side.
const DOCK = {
  bottom: { prop: "--dock-h", key: "agent-board-dock-h", other: "side", label: "Dock at side", initial: () => innerHeight * 0.4, size: (e) => innerHeight - e.clientY, min: 160, max: () => innerHeight - 120 },
  side: { prop: "--dock-w", key: "agent-board-dock-w", other: "bottom", label: "Dock at bottom", initial: () => Math.min(760, innerWidth * 0.42), size: (e) => innerWidth - e.clientX, min: 360, max: () => innerWidth - 320 },
};
const dockSize = (pos, px) => document.documentElement.style.setProperty(DOCK[pos].prop, `${Math.round(px)}px`);
let dockPos = store.get("agent-board-dock-pos", "bottom") === "side" ? "side" : "bottom";
function placeDock(pos) {
  dockPos = pos;
  dock.classList.toggle("side", pos === "side");
  document.body.classList.toggle("dock-side", pos === "side");
  const b = document.getElementById("dockpos");
  b.textContent = DOCK[pos].label;
  b.title = `Move the agent view to the ${DOCK[pos].other}`;
  store.set("agent-board-dock-pos", pos);
}
// The side panel starts under the page header, whose height changes when it wraps.
const header = document.querySelector("header");
new ResizeObserver(() => document.documentElement.style.setProperty("--hdr-h", `${header.offsetHeight}px`)).observe(header);
function showDock(on) {
  dock.hidden = !on;
  document.body.classList.toggle("docked", on);
  document.getElementById("dockbtn").classList.toggle("on", on);
  store.set("agent-board-dock", on ? "1" : "0");
  if (on && !dockPane) {
    const a = DOCK_AGENTS[dockAgent];
    dockPane = livePane(document.getElementById("dockterm"), a.path, {
      setState: (t) => (document.getElementById("dockstate").textContent = t),
      live: a.live,
      ended: "The agent view closed. Reconnect starts it again.",
    });
  } else if (!on && dockPane) {
    dockPane.stop();
    dockPane = null;
  }
}
document.getElementById("dockbtn").onclick = () => showDock(dock.hidden);
document.getElementById("dockagent").onclick = (e) => {
  const next = e.target.closest("[data-dockagent]")?.dataset.dockagent;
  if (!next || next === dockAgent) return;
  dockAgent = next;
  store.set("agent-board-dock-agent", next);
  showDockAgent();
  // Each agent view keeps running on the server; switching only changes which one this dock shows.
  dockPane?.stop();
  dockPane = null;
  document.getElementById("dockterm").innerHTML = "";
  if (!dock.hidden) showDock(true);
};
showDockAgent();
document.getElementById("dockx").onclick = () => showDock(false);
document.getElementById("dockre").onclick = () => dockPane?.reconnect();
document.getElementById("dockpos").onclick = () => placeDock(DOCK[dockPos].other);
document.getElementById("dockgrip").onpointerdown = (e) => {
  const grip = e.currentTarget;
  grip.setPointerCapture(e.pointerId);
  const d = DOCK[dockPos];
  const clamp = (ev) => Math.min(d.max(), Math.max(d.min, d.size(ev)));
  grip.onpointermove = (m) => dockSize(dockPos, clamp(m));
  grip.onpointerup = (u) => {
    grip.onpointermove = grip.onpointerup = null;
    store.set(d.key, String(Math.round(clamp(u))));
  };
};
for (const pos of Object.keys(DOCK)) dockSize(pos, Number(store.get(DOCK[pos].key, "")) || DOCK[pos].initial());
placeDock(dockPos);
if (store.get("agent-board-dock", "0") === "1") showDock(true);

const list = (items, lead) =>
  items.length ? `<ul>${items.map((x, i) => `<li class="${lead && i === 0 ? "lead" : ""}">${esc(x)}</li>`).join("")}</ul>` : '<div class="empty">none</div>';

function summaryHtml(d) {
  const s = d.summary;
  const m = d.summaryMeta;
  const status = m.pending
    ? "Summarizing…"
    : m.at
      ? `Summary · ${ago(m.at)}${m.costUsd ? ` · $${m.costUsd.toFixed(4)}` : ""}${m.stale ? " · session has moved on since" : ""}`
      : "No summary yet";
  return `<div class="sum">
    <div class="sec muted" style="display:flex;gap:10px;align-items:center">${esc(status)}${m.error ? ` <span class="chip bad" title="${esc(m.error)}">last run failed</span>` : ""}
      <button class="btn" id="resum" ${m.pending ? "disabled" : ""}>Re-summarize</button></div>
    <div class="sec"><h4>Summary</h4>${nowHtml(d) || '<span class="empty">no summary yet</span>'}${d.ending && d.status !== d.ending.text ? `<div class="muted">${esc(d.ending.text)}</div>` : ""}</div>
    <div class="sec"><h4>Goal</h4>${esc(s?.goal ?? d.goal ?? "") || '<span class="empty">unknown</span>'}</div>
    <div class="sec"><h4>Needs you${d.waitingSince && needsOf(d).length ? ` · waiting ${dur(d.waitingSince)}` : ""}</h4>${list(needsOf(d), Boolean(d.blocker))}</div>
    <div class="sec"><h4>Concerns / out of the loop</h4>${list(concernsOf(d), Boolean(d.failed))}</div>
    <div class="sec"><h4>Done</h4>${list(s?.done ?? [])}</div>
    <div class="sec"><h4>Next</h4>${list(s?.next ?? [])}</div>
  </div>`;
}

function contextHtml(d) {
  const sec = (title, body) => `<div class="sec"><h4>${title}</h4>${body}</div>`;
  const roleOf = (s) => [s.produced && `wrote ${s.produced}×`, s.used && `read ${s.used}×`, s.linked && "you linked it"].filter(Boolean).join(" · ");
  const row = (s) => {
    const also = data.cards.filter((c) => c.id !== d.id).flatMap((c) => {
      const x = (c.context ?? []).find((y) => y.key === s.key);
      return x ? [`${esc(c.name)} (${x.produced ? "wrote" : x.used ? "read" : "linked"})`] : [];
    });
    const status = s.status ? ` · ${esc(s.status)} as of ${ago(Date.parse(s.statusAt))}` : "";
    return `<div class="crow">${srcChip({ ...s, touched: [], pins: [] }, { anchor: true })}
      <div class="muted">${esc(kindOf(s)[0])} · ${roleOf(s)} · last ${ago(Date.parse(s.lastAt))}${status}</div>
      ${also.length ? `<div class="muted">Also in: ${also.join(", ")}</div>` : ""}${s.note ? `<div class="muted">${esc(s.note)}</div>` : ""}</div>`;
  };
  return [
    sec("Pinned to this session", `${pinForm({ session: d.sessionId })}${pinRows(pinsOfCard(d))}`),
    sec("Touched by this session", d.context.length ? d.context.map(row).join("") : '<div class="empty">No Notion, Linear, Slack, pull request or artifact calls yet.</div>'),
  ].join("");
}

function tabHtml(d) {
  if (tab === "summary") return summaryHtml(d);
  if (tab === "context") return contextHtml(d);
  if (tab === "spec") {
    return [
      d.result && `<div class="sec"><h4>Result</h4><div class="md">${md(d.result)}</div></div>`,
      d.plan && `<div class="sec"><h4>Approved plan</h4><div class="md">${md(d.plan)}</div></div>`,
      `<div class="sec"><h4>Markdown written by this session</h4>${
        d.docs.length ? d.docs.map((doc, i) => `<details class="doc" ${i === 0 ? "open" : ""}><summary>${esc(short(doc.path))}</summary>
          <div class="md">${doc.content == null ? '<span class="empty">file no longer on disk</span>' : md(doc.content)}</div></details>`).join("")
        : '<div class="empty">none</div>'}</div>`,
      d.links.length && `<div class="sec"><h4>Artifacts</h4>${d.links.map((l) => `<div><a href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.title)}</a></div>`).join("")}</div>`,
      `<div class="sec"><h4>Original ask</h4><div class="md">${md(d.intent) || '<span class="empty">interactive session — no recorded intent</span>'}</div></div>`,
    ].filter(Boolean).join("");
  }
  if (tab === "progress") {
    const mark = { completed: "☑", in_progress: "◐", pending: "☐" };
    return [
      `<div class="sec"><h4>Tasks</h4>${d.tasks.length ? d.tasks.map((t) => `<div class="task"><span>${mark[t.status] ?? "·"}</span><span>${esc(t.subject)}${t.owner ? ` <span class="chip">${esc(t.owner)}</span>` : ""}</span></div>`).join("") : '<div class="empty">no task list</div>'}</div>`,
      d.fan.length && `<div class="sec"><h4>Sub-agents</h4>${d.fan.map((f) => `<div class="task"><span>${f.doneAt ? "☑" : "◐"}</span><span>${esc(f.label)}</span></div>`).join("")}</div>`,
      `<div class="sec"><h4>Timeline</h4>${d.timeline.length ? d.timeline.map((e) => `<div class="tl"><div class="when">${new Date(e.at).toLocaleString()} · ${esc(e.state)}</div><div class="md">${md(e.text ?? e.detail)}</div></div>`).join("") : '<div class="empty">no timeline (interactive session)</div>'}</div>`,
    ].filter(Boolean).join("");
  }
  return d.team.length
    ? d.team.map((m) => `<details class="doc"><summary><b>${esc(m.name)}</b> · ${esc(m.agentType)}${m.model ? ` · ${esc(m.model)}` : ""}</summary><div class="md">${md(m.prompt)}</div></details>`).join("")
    : '<div class="empty">no agent team in this session</div>';
}

// ---- New session
const newDlg = document.getElementById("newdlg");
const newForm = document.getElementById("newform");
// Codex starts with the model, sandbox and approvals in its own config, and has no worktree or extra-folder option.
const showNewAgent = () => (newForm.querySelector(".claude-only").hidden = newForm.elements.cli.value === "codex");
newForm.elements.cli.onchange = () => {
  store.set("agent-board-new-cli", newForm.elements.cli.value);
  showNewAgent();
};
function openNew(tag, laneId) {
  newForm.reset();
  newForm.elements.cli.value = store.get("agent-board-new-cli", "claude") === "codex" ? "codex" : "claude";
  newForm.elements.cwd.value = data.dirs?.[0] ?? "";
  newForm.elements.tags.value = tag;
  const lane = laneId && shownLanes.find((l) => l.id === laneId);
  const pack = lane ? contextPack(lane) : { issue: "", links: [] };
  newForm.elements.issue.value = pack.issue;
  newForm.elements.context.value = pack.links.join("\n");
  document.getElementById("newsettings").innerHTML = settingsFields();
  document.getElementById("dirlist").innerHTML = (data.dirs ?? []).map((d) => `<option value="${esc(d)}">`).join("");
  document.getElementById("taglist2").innerHTML = knownTags().map((t) => `<option value="${esc(t)}">`).join("");
  document.getElementById("newnote").textContent = pack.issue || pack.links.length ? "The group's issue and key links are filled in; edit or remove them." : "";
  showNewAgent();
  newDlg.showModal();
  newForm.elements.prompt.focus();
  newForm.elements.prompt.setSelectionRange(0, 0);
}
const csv = (v) => String(v ?? "").split(",").map((t) => t.trim()).filter(Boolean);
newForm.onsubmit = async (e) => {
  e.preventDefault();
  const f = new FormData(newForm);
  const lines = String(f.get("context") ?? "").split("\n").map((x) => x.trim()).filter(Boolean);
  const common = { cli: f.get("cli"), prompt: f.get("prompt"), issue: f.get("issue"), context: lines, cwd: f.get("cwd"), name: f.get("name"), tags: csv(f.get("tags")) };
  const body = common.cli === "codex" ? common : { ...common, ...settingsBody(newForm), worktree: f.get("worktree") === "on", addDirs: csv(f.get("addDirs")) };
  const go = document.getElementById("newgo");
  const note = document.getElementById("newnote");
  go.disabled = true;
  note.className = "note";
  note.textContent = "Starting…";
  try {
    const r = await fetch("/api/sessions", { method: "POST", headers: { ...WRITE_HEADERS, "content-type": "application/json" }, body: JSON.stringify(body) });
    const res = await r.json().catch(() => ({ ok: false, message: `HTTP ${r.status}` }));
    if (!res.ok) throw new Error(res.message || `HTTP ${r.status}`);
    newDlg.close();
    await refresh();
    notes.set(res.id, { text: res.message });
    openCard(res.id);
  } catch (err) {
    note.className = "note bad";
    note.textContent = err.message;
  } finally {
    go.disabled = false;
  }
};

// ---- Page wiring
document.getElementById("board").addEventListener("click", (e) => {
  if (view === "prs") return prsClick(e);
  if (view === "journal") return journalClick(e);
  if (view === "daily") return dailyClick(e);
  const aact = e.target.closest("[data-aact]");
  if (aact) {
    const c = data.cards.find((x) => x.id === aact.closest("[data-id]").dataset.id);
    return c && runAction(c, aact.dataset.aact);
  }
  const sync = e.target.closest("[data-syncpr]");
  if (sync) {
    const c = data.cards.find((x) => x.id === sync.dataset.syncpr);
    return c && syncPr(c);
  }
  const add = e.target.closest("[data-newin]");
  if (add) return openNew(add.dataset.newin, add.dataset.lane);
  const toggle = (set, id) => (set.has(id) ? set.delete(id) : set.add(id), render());
  const shelfBtn = e.target.closest("[data-shelf]");
  if (shelfBtn) return toggle(openShelves, shelfBtn.dataset.shelf);
  const pinBtn = e.target.closest("[data-pinlane]");
  if (pinBtn) return toggle(pinPanels, pinBtn.dataset.pinlane);
  const specOpen = e.target.closest("[data-specopen]");
  if (specOpen) return toggle(openSpecLanes, specOpen.dataset.specopen);
  const hiddenBtn = e.target.closest("[data-showhidden]");
  if (hiddenBtn) return toggle(openHidden, hiddenBtn.dataset.showhidden);
  const drop = e.target.closest("[data-drop]");
  if (drop) return dropSpec(shownLanes.find((l) => l.id === drop.closest("[data-speclane]").dataset.speclane), drop.dataset.drop);
  const unhide = e.target.closest("[data-unhide]");
  if (unhide) return restoreSpec(unhide.dataset.unhide);
  const unpin = e.target.closest("[data-unpin]");
  if (unpin) return removePin(unpin.dataset.unpin);
  if (e.target.closest(".shelf, .pinpanel, a[href]")) return;
  const lane = e.target.closest(".lane-h");
  if (lane) {
    const id = lane.dataset.lane;
    collapsed = new Set(collapsed.has(id) ? [...collapsed].filter((x) => x !== id) : [...collapsed, id]);
    store.set("agent-board-collapsed", JSON.stringify([...collapsed]));
    return render();
  }
  const el = e.target.closest(".card");
  if (el) openCard(el.dataset.id);
});
document.getElementById("board").addEventListener("change", (e) => {
  if (e.target.matches("[data-jengine]")) return setEngine("brief", e.target.value);
  if (e.target.matches("[data-dengine]")) return setEngine("daily", e.target.value);
  const jitem = e.target.closest("[data-jitem]");
  if (jitem && e.target.matches("[data-jcheck]")) return journalWrite("PUT", `/items/${jitem.dataset.jitem}`, { done: e.target.checked });
  if (jitem && e.target.matches("[data-jmove]")) return journalWrite("PUT", `/items/${jitem.dataset.jitem}`, { horizon: e.target.value });
  const sel = e.target.closest("[data-aoutcome]");
  if (sel) setOutcome(sel.dataset.aoutcome, sel.value);
});
document.getElementById("board").addEventListener("submit", (e) => {
  const jform = e.target.closest(".jn-add, .jn-noteform");
  if (jform) {
    e.preventDefault();
    return journalSubmit(jform);
  }
  const form = e.target.closest(".pinform");
  if (!form) return;
  e.preventDefault();
  addPin(JSON.parse(form.dataset.pintarget), form);
});
document.getElementById("board").addEventListener("keydown", (e) => {
  const form = e.target.closest?.(".jn-noteform");
  if (form && e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
    e.preventDefault();
    journalSubmit(form);
  }
});
// toggle does not bubble, so it is caught on the way down.
document.getElementById("board").addEventListener("toggle", (e) => {
  if (e.target.matches?.(".dl-prs")) prsOpen = e.target.open;
  const row = e.target.closest?.(".arow");
  if (!row) return;
  if (row.open) openRows.add(row.dataset.id);
  else openRows.delete(row.dataset.id);
}, true);
document.getElementById("views").addEventListener("click", (e) => {
  const b = e.target.closest("[data-view]");
  if (!b) return;
  view = b.dataset.view;
  store.set("agent-board-view", view);
  render();
  if (view === "prs") loadPrs();
  if (view === "journal") loadJournal();
  if (view === "daily") loadDaily();
});
async function setEngine(kind, value) {
  try {
    const r = await fetch("/api/settings", { method: "PUT", headers: { ...WRITE_HEADERS, "content-type": "application/json" }, body: JSON.stringify({ engines: { [kind]: value } }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message ?? `HTTP ${r.status}`);
  } catch (e) {
    alert(`Could not switch the engine: ${e.message}`);
  }
  await refresh();
}
const compactBox = document.getElementById("compact");
compactBox.checked = compact;
document.body.classList.toggle("compact", compact);
compactBox.addEventListener("change", () => {
  compact = compactBox.checked;
  document.body.classList.toggle("compact", compact);
  store.set("agent-board-compact", compact ? "1" : "0");
  render();
});
const specsBox = document.getElementById("specs");
specsBox.checked = specsOn;
specsBox.addEventListener("change", () => {
  specsOn = specsBox.checked;
  store.set("agent-board-specs", specsOn ? "1" : "0");
  render();
});
const lanesBox = document.getElementById("lanes");
lanesBox.checked = lanesOn;
lanesBox.addEventListener("change", () => {
  lanesOn = lanesBox.checked;
  store.set("agent-board-lanes", lanesOn ? "1" : "0");
  render();
});
document.getElementById("q").addEventListener("input", render);
// Escape closes the drawer, except inside the dialog or the terminal, where it belongs to them.
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !newDlg.open && !mdDlg.open && !e.target.closest?.(".xterm")) closeDrawer();
});
document.getElementById("newbtn").onclick = () => openNew("");
document.getElementById("newcancel").onclick = () => newDlg.close();
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
